<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulwark Mission Log</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════════════════════════
   BULWARK · MISSION LOG — design prototype (MLG-1). Standalone: open in any browser.
   Tokens follow the shipped menu ("gold on ink", menu.js / progressWidget.js). The game has no CSS
   variables today; the implementation should lift these into the menu CSS string as-is.
   ═══════════════════════════════════════════════════════════════════════════════════════════════ */
:root{
  /* ink + panels (shipped) */
  --ink:#0c0e12; --ink2:#14181f; --panel:#1a1f28; --panel-hi:#20262f; --well:#0f1217;
  --line:#2e3846; --line2:#232a34; --line3:#3e4a5a;
  --text:#e6ecf3; --dim:#8fa0b3; --dimmer:#5c6a7a;
  --gold:#f2c869; --gold2:#d9a441; --cyan:#7af0ff; --cyan2:#34e1ff; --cyan3:#2aa8d8;
  /* STATUS LANGUAGE — one hue per state, always paired with a shape (never colour alone) */
  --s-new:#34e1ff;     /* New       ◆ diamond   — just logged, not yet opened            */
  --s-active:#f2c869;  /* Active    ◔ arc       — in progress                            */
  --s-risk:#ff8a3d;    /* At risk   ▲ triangle  — will fail or expire soon               */
  --s-ready:#5fe39a;   /* Ready     ⬢ hex+tick  — objectives met, rewards waiting        */
  --s-failed:#ef5350;  /* Failed    ⬢ hex+cross — broken / expired / abandoned           */
  --s-done:#7b8898;    /* Completed ✓ tick      — rewards collected, archived            */
  --s-locked:#566273;  /* Locked    padlock     — visible, gates not met yet             */
  /* resource rarity (CRYSTAL, lowpoly-palettes.js) */
  --r-common:#5aa8f0; --r-uncommon:#f2c84a; --r-rare:#e85050; --r-epic:#52c070;
  --f-ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan2);outline-offset:2px}
svg.i{width:1em;height:1em;flex:none;display:block}
.num{font-variant-numeric:tabular-nums}

/* ───────── review bar (not part of the game) ───────── */
.rv{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:900;display:flex;max-width:calc(100vw - 16px);overflow-x:auto;gap:4px;padding:4px;
  background:rgba(8,10,14,.92);border:1px solid var(--line);backdrop-filter:blur(6px)}
.rv button{white-space:nowrap;padding:7px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.rv button[aria-pressed=true]{color:var(--ink);background:var(--gold)}
.rv button:hover:not([aria-pressed=true]){color:var(--text);background:var(--panel)}
.rv .sep{width:1px;background:var(--line);margin:4px 2px}
@media (max-height:500px){.rv{bottom:6px}.rv button{padding:5px 8px;font-size:9px}}

/* ═══════════════════════ GAME VIEW ═══════════════════════ */
#game{position:fixed;inset:0;overflow:hidden}
.backdrop{position:absolute;inset:0;background:var(--ink) center/cover no-repeat;filter:saturate(.9)}
.stars{position:absolute;inset:0;background:
  radial-gradient(1px 1px at 12% 22%,#fff8 50%,transparent),radial-gradient(1px 1px at 72% 64%,#fff6 50%,transparent),
  radial-gradient(1px 1px at 38% 81%,#fff5 50%,transparent),radial-gradient(1px 1px at 88% 14%,#fff7 50%,transparent),
  radial-gradient(1px 1px at 55% 42%,#fff4 50%,transparent),radial-gradient(1px 1px at 22% 58%,#fff5 50%,transparent)}

/* top bar — mirrors .bwm-top / .bwm-prog (menu.js:315, progressWidget.js:13-77) */
.top{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:20px 30px;
  background:linear-gradient(180deg,rgba(10,12,16,.98) 0%,rgba(10,12,16,.96) 70%,rgba(10,12,16,0))}
.crest{width:42px;height:46px;display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--ink);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--gold),var(--gold2));
  filter:drop-shadow(0 0 10px rgba(217,164,65,.35))}
.word{display:flex;flex-direction:column}
.word b{font-size:24px;letter-spacing:.32em;font-weight:900;color:var(--text)}
.word b span{color:var(--gold)}
.word i{font-style:normal;font-size:10px;letter-spacing:.42em;color:var(--dim);margin-top:2px}
.prog{margin-left:auto;display:flex;gap:8px;align-items:stretch}
.chip{position:relative;display:flex;align-items:center;gap:10px;height:52px;padding:0 14px;background:rgba(20,24,31,.82);
  border:1px solid var(--line)}
button.chip:hover{border-color:var(--gold2);background:var(--panel-hi)}
.chip .lbl{font-size:9px;letter-spacing:.28em;color:var(--dim);text-transform:uppercase}
.chip .v{display:flex;flex-direction:column;line-height:1.15}
.chip .v b{font-size:16px;font-weight:800}
.hex{width:34px;height:38px;display:grid;place-items:center;font-weight:900;color:var(--ink);font-size:16px;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--cyan),var(--cyan3))}
.rank{min-width:190px}
.rank .rk{display:flex;flex-direction:column;gap:4px;flex:1}
.rank .rk i{font-style:normal;font-size:12px;font-weight:800;letter-spacing:.18em;text-align:center}
.xpbar{height:4px;background:#0d1117;border:1px solid var(--line2)}
.xpbar span{display:block;height:100%;width:42%;background:linear-gradient(90deg,var(--cyan3),var(--cyan));box-shadow:0 0 8px var(--cyan2)}
.rank em{font-style:normal;font-size:9px;letter-spacing:.2em;color:var(--dim);text-align:center}
.gold .ic{color:var(--gold)} .starsC .ic{color:#ffe08a} .res .ic{color:var(--cyan2)}
.chip .ic{width:18px;height:18px}

/* ── MISSION LOG BUTTON (new) — sits left of Player Info ── */
.mlbtn{gap:11px;padding:0 14px 0 12px;border-color:#4a3c1c;background:linear-gradient(180deg,rgba(38,33,22,.9),rgba(22,22,24,.9))}
.mlbtn .glyph{position:relative;width:30px;height:30px;color:var(--gold);display:grid;place-items:center}
.mlbtn .glyph svg{width:26px;height:26px}
.mlbtn .v b{font-size:12px;letter-spacing:.2em;font-weight:800}
.mlbtn .v .lbl{letter-spacing:.2em;font-size:9px;color:var(--dim)}
.mlbtn .v .lbl em{font-style:normal;color:var(--s-ready);font-weight:700}
.mlbtn .count{position:absolute;right:-7px;top:-7px;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;
  font-size:10px;font-weight:900;color:var(--ink);background:var(--s-ready);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  filter:drop-shadow(0 0 6px rgba(95,227,154,.7))}
.mlbtn[aria-expanded=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(242,200,105,.35)}
.mlbtn.ping{animation:ping 1.1s ease-out 2}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,225,255,.8),0 0 0 1px var(--s-new)}100%{box-shadow:0 0 0 14px rgba(52,225,255,0),0 0 0 1px var(--s-new)}}

/* phone landscape / narrow — matches the shipped ≤900 / ≤560 / max-height:500 rules */
@media (max-width:900px){.chip .lbl,.word i{display:none}.rank{min-width:0}.rank .rk em{display:none}.mlbtn .v .lbl{display:none}}
@media (max-width:560px){.rank .rk,.word{display:none}.mlbtn .v{display:none}.top{padding:14px 10px;gap:6px}.prog{gap:4px}.chip{padding:0 8px;gap:6px}.crest{flex:none}.res{display:none}}
@media (max-height:500px){.top{padding:8px 14px;gap:8px}.chip{height:40px;padding:0 10px}.crest{width:32px;height:36px;font-size:16px}
  .word b{font-size:17px}.hex{width:28px;height:31px;font-size:13px}.rank .rk i{font-size:11px}.chip .v b{font-size:14px}
  .mlbtn .glyph{width:24px;height:24px}.mlbtn .glyph svg{width:22px;height:22px}}

/* ───────── assignment toast — the moment a mission is logged ───────── */
.toast{position:absolute;z-index:40;top:84px;right:30px;width:min(380px,calc(100vw - 32px));display:flex;gap:12px;align-items:center;
  padding:12px 14px 12px 12px;background:linear-gradient(180deg,#18202a,#10141a);border:1px solid var(--s-new);
  box-shadow:0 0 30px -8px rgba(52,225,255,.55),0 20px 40px rgba(0,0,0,.6);transform:translateY(-12px);opacity:0;pointer-events:none;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .35s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast .tt{flex:1;min-width:0}
.toast .k,.toast .n,.toast .g{display:block}
.toast .k{font-size:9px;letter-spacing:.3em;color:var(--s-new);font-weight:800}
.toast .n{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast .g{font-size:12px;color:var(--dim)}
.toast .bar{margin-top:7px}
@media (max-height:500px){.toast{top:54px;right:14px}}

/* ═══════════════════════ MISSION LOG SCREEN ═══════════════════════ */
.log{position:absolute;z-index:30;left:30px;right:30px;top:92px;bottom:58px;display:grid;grid-template-columns:minmax(340px,440px) 1fr;
  background:rgba(10,12,16,.94);border:1px solid var(--line);box-shadow:0 0 0 1px rgba(242,200,105,.12),0 40px 80px rgba(0,0,0,.7);
  opacity:0;transform:translateY(10px) scale(.99);pointer-events:none;transition:opacity .28s,transform .28s cubic-bezier(.2,.8,.2,1)}
.log.on{opacity:1;transform:none;pointer-events:auto}
.log::before{content:"";position:absolute;left:-1px;top:-1px;width:120px;height:2px;background:var(--gold)}
.log::after{content:"";position:absolute;right:-1px;bottom:-1px;width:120px;height:2px;background:var(--gold)}

/* list pane */
.lp{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line2)}
.lp-head{display:flex;align-items:center;gap:12px;padding:18px 20px 12px}
.lp-head h1{font-size:22px;font-weight:900;letter-spacing:.24em}
.lp-head .sum{margin-left:auto;font-size:11px;color:var(--dim);letter-spacing:.12em;text-align:right}
.lp-head .sum b{color:var(--text)}
.lp-head .x{display:none}
.tabs{display:flex;gap:2px;padding:0 20px 12px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:34px;font-size:10px;font-weight:800;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);background:var(--well);border:1px solid var(--line2)}
.tab b{font-size:11px;color:var(--text);font-weight:800}
.tab[aria-selected=true]{color:var(--ink);background:var(--gold);border-color:var(--gold)}
.tab[aria-selected=true] b{color:var(--ink)}
.tab .dot{width:7px;height:7px;background:var(--s-ready);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.list{flex:1;overflow-y:auto;padding:0 12px 14px 20px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.grp{font-size:10px;letter-spacing:.26em;color:var(--dimmer);font-weight:800;padding:12px 0 6px;display:flex;align-items:center;gap:10px}
.grp::after{content:"";flex:1;height:1px;background:var(--line2)}

/* mission row */
.row{--sc:var(--s-active);position:relative;display:grid;grid-template-columns:44px 1fr auto;grid-template-rows:auto auto;column-gap:12px;row-gap:7px;
  width:100%;text-align:left;padding:11px 12px 11px 10px;margin-bottom:6px;background:linear-gradient(90deg,rgba(26,31,40,.95),rgba(20,24,31,.9));
  border:1px solid var(--line2);border-left:3px solid var(--sc);transition:background .15s,border-color .15s}
.row:hover{background:var(--panel-hi);border-color:var(--line3);border-left-color:var(--sc)}
.row[aria-selected=true]{background:linear-gradient(90deg,color-mix(in srgb,var(--sc) 14%,#1a1f28),#1a1f28);border-color:color-mix(in srgb,var(--sc) 45%,#2e3846);border-left-color:var(--sc)}
.row[aria-selected=true]::after{content:"";position:absolute;right:-13px;top:50%;width:10px;height:10px;margin-top:-5px;background:var(--sc);
  clip-path:polygon(0 0,100% 50%,0 100%)}
.row.st-done,.row.st-failed{background:rgba(18,21,27,.85)}
.row.st-done .title,.row.st-failed .title{color:#b4bfcc}
.badge{grid-row:1 / span 2;align-self:center;position:relative;width:44px;height:48px;display:grid;place-items:center;color:var(--sc)}
.badge::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  background:linear-gradient(160deg,color-mix(in srgb,var(--sc) 26%,#11151b),#0c0f14)}
.badge::after{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%,0 25%,2px 26%,2px 74%,50% 97.5%,calc(100% - 2px) 74%,calc(100% - 2px) 26%,50% 2.5%,2px 26%,0 25%);
  background:var(--sc);opacity:.75}
.badge svg{position:relative;width:22px;height:22px}
.st-done .badge{color:#9aa6b4}
.mid{min-width:0;display:block}
.title{display:block;font-weight:800;font-size:14.5px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
.sub .fi{width:13px;height:13px;color:var(--fc)}
.sub span{overflow:hidden;text-overflow:ellipsis}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rw{display:flex;gap:3px}
.rwi{position:relative;width:24px;height:24px;display:grid;place-items:center;background:var(--well);border:1px solid var(--line2);color:var(--rc,var(--text))}
.rwi svg{width:15px;height:15px}
.rwi.more{width:auto;padding:0 5px;font-size:10px;font-weight:800;color:var(--dim)}
.prow{grid-column:2 / span 2;display:flex;align-items:center;gap:10px}
.prow .bar{flex:1}
.prow .pct{font-size:11px;font-weight:800;min-width:46px;text-align:right;color:var(--sc)}
.st-done .prow .pct{color:var(--dim)}

/* status tag — hue + glyph + word */
.tag{display:inline-flex;align-items:center;gap:5px;height:18px;padding:0 6px 0 5px;font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent);border:1px solid color-mix(in srgb,var(--sc) 45%,transparent);white-space:nowrap}
.tag svg{width:10px;height:10px}
.st-new .tag svg{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.st-ready .tag{color:var(--ink);background:var(--s-ready);border-color:var(--s-ready);box-shadow:0 0 12px rgba(95,227,154,.45)}

/* ── progress bar — segmented when the count is small, continuous otherwise ── */
.bar{--sc:var(--s-active);position:relative;height:8px;display:flex;gap:2px}
.bar .seg{flex:1;background:#0b0e13;border:1px solid var(--line2);position:relative;overflow:hidden}
.bar .seg.f{background:var(--sc);border-color:var(--sc);box-shadow:0 0 6px color-mix(in srgb,var(--sc) 55%,transparent)}
.bar.cont{display:block;background:#0b0e13;border:1px solid var(--line2)}
.bar.cont .fill{position:absolute;left:0;top:0;bottom:0;background:var(--sc);box-shadow:0 0 8px color-mix(in srgb,var(--sc) 55%,transparent)}
.bar.cont .tick{position:absolute;top:-1px;bottom:-1px;width:1px;background:rgba(12,14,18,.9)}
.bar.st-ready .seg.f,.bar.st-ready .fill{background:linear-gradient(90deg,var(--s-ready),#b8ffd6,var(--s-ready));background-size:300% 100%;animation:sweep 2.4s linear infinite}
@keyframes sweep{from{background-position:100% 0}to{background-position:-200% 0}}
.bar.st-risk .seg.f,.bar.st-risk .fill{background:repeating-linear-gradient(-45deg,var(--s-risk) 0 5px,#c4581c 5px 9px)}
.bar.st-failed .seg:not(.f){background:repeating-linear-gradient(-45deg,rgba(239,83,80,.22) 0 2px,transparent 2px 5px);border-color:rgba(239,83,80,.35)}
.bar.st-failed .seg.f,.bar.st-failed .fill{background:#7d2d2c;border-color:#7d2d2c;box-shadow:none}
.bar.st-done .seg.f,.bar.st-done .fill{background:#566170;border-color:#566170;box-shadow:none}
.bar.big{height:12px;gap:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ═══ detail pane — the dossier ═══ */
.dp{position:relative;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.dossier{--sc:var(--s-active);--fc:var(--gold);display:grid;grid-template-columns:1fr 250px;gap:0;min-height:100%}
/* two columns: each scrolls on its own and the action stays pinned at the foot of the giver column */
@media (min-width:981px),(max-height:500px) and (min-width:701px){.dp{overflow:hidden}.dossier{height:100%}.dmain,.dside{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
 .actions{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(14,17,22,0),rgba(14,17,22,.97) 22%);padding-top:22px}}
.dmain{padding:22px 28px 28px;min-width:0}
.dside{border-left:1px solid var(--line2);background:linear-gradient(180deg,rgba(20,24,31,.6),rgba(12,14,18,.6));display:flex;flex-direction:column}
.dback{display:none}
.dk{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dk .type{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:var(--sc)}
.dk .type svg{width:16px;height:16px}
.dk .where{font-size:11px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.dtitle{font-size:34px;line-height:1.05;font-weight:900;letter-spacing:.01em;margin:10px 0 6px;text-wrap:balance}
.dprog{display:flex;align-items:center;gap:14px;margin:16px 0 4px}
.dprog .bar{flex:1}
.dprog .pct{font-size:22px;font-weight:900;color:var(--sc);min-width:70px;text-align:right}
.dprog .pct small{font-size:12px;color:var(--dim);font-weight:700}
.dnote{font-size:12px;color:var(--sc);display:flex;gap:6px;align-items:center;min-height:18px}
.dnote svg{width:12px;height:12px}
.brief{margin:18px 0 6px;padding:14px 16px 14px 18px;background:var(--well);border:1px solid var(--line2);border-left:3px solid var(--fc);font-size:14px;color:#c9d3de;max-width:68ch}
.brief q{display:block;font-style:italic;color:var(--text);quotes:"\201C" "\201D"}
.brief .who{margin-top:8px;font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.sec{margin-top:22px}
.sec h3{font-size:10px;letter-spacing:.3em;color:var(--dim);font-weight:900;margin-bottom:9px;display:flex;gap:10px;align-items:center}
.sec h3::after{content:"";flex:1;height:1px;background:var(--line2)}
.obj{display:grid;grid-template-columns:22px 1fr 150px 76px;align-items:center;gap:10px;padding:9px 12px;background:rgba(20,24,31,.7);border:1px solid var(--line2);margin-bottom:4px}
.obj .ck{width:18px;height:18px;color:var(--dimmer)}
.obj.ok .ck{color:var(--s-ready)}
.obj.bad .ck{color:var(--s-failed)}
.obj .ot{font-size:13.5px}
.obj.ok .ot{color:#cfe9da}
.obj .oc{font-size:12px;font-weight:800;text-align:right;white-space:nowrap}
.obj.opt .ot::after{content:"Bonus";margin-left:8px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(242,200,105,.4);padding:1px 5px;vertical-align:2px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}
.item{--rc:var(--r-common);display:flex;gap:10px;align-items:center;padding:9px 10px;background:var(--well);border:1px solid var(--line2);border-left:3px solid var(--rc)}
.item .gem{width:34px;height:34px;display:grid;place-items:center;color:var(--rc);background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--rc) 28%,transparent),transparent 70%)}
.item .gem svg{width:24px;height:24px}
.item b{display:block;font-size:13px;white-space:nowrap}
.item small{white-space:nowrap}
.item small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--rc);font-weight:800}
.item .have{margin-left:auto;font-size:13px;font-weight:800;text-align:right;white-space:nowrap}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.rwd{--rc:var(--gold);position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 10px;background:linear-gradient(180deg,#171c24,#10141a);border:1px solid var(--line2);text-align:center}
.rwd::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--rc);opacity:.85}

/* side: giver card */
.giver{padding:20px 18px 16px}
.pframe{position:relative;width:100%;aspect-ratio:3/4;background:#0b0e13;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 18px),calc(100% - 18px) 100%,0 100%)}

.pframe::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(10,12,16,.95));pointer-events:none}

/* alignment rail: AG … DE, 9 steps, giver marked */

.rail-codes{display:grid;grid-template-columns:repeat(9,1fr);font-size:8.5px;text-align:center;color:var(--dimmer);font-weight:800}
.rail-codes .on{color:var(--text)}
.align .al-n{margin-top:8px;font-size:13px;font-weight:800}
.align .al-n small{display:block;font-size:10.5px;color:var(--dim);font-weight:600;margin-top:2px}
.loy{margin:16px 18px 0;padding:10px 12px;background:var(--well);border:1px solid var(--line2)}

.loy .lb i{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--dim)}

.actions{margin-top:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.btn{height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;
  background:var(--panel);border:1px solid var(--line)}
.btn:hover{border-color:var(--gold2);background:var(--panel-hi)}
.btn svg{width:16px;height:16px}
.btn.primary{color:var(--ink);background:linear-gradient(180deg,var(--gold),var(--gold2));border-color:var(--gold);box-shadow:0 0 22px rgba(242,200,105,.35)}
.btn.claim{color:#06130c;background:linear-gradient(180deg,#8ff3bb,var(--s-ready));border-color:var(--s-ready);box-shadow:0 0 26px rgba(95,227,154,.5);height:52px;font-size:13px}

/* claim moment */
.burst{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;z-index:5}
.burst span{position:absolute;width:12px;height:12px;background:var(--s-ready);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);opacity:0;animation:fly 1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}

/* empty state */
.empty{padding:40px 20px;text-align:center;color:var(--dim);font-size:13px}

/* inventory */
.invbtn{border-color:#1f4a55;background:linear-gradient(180deg,rgba(18,36,44,.9),rgba(20,22,26,.9))} .invbtn .glyph{color:var(--cyan2)}
.invbtn[aria-expanded=true]{border-color:var(--cyan2);box-shadow:0 0 0 1px var(--cyan2),0 0 22px rgba(52,225,255,.3)}
.inv::before,.inv::after{background:var(--cyan2)}
.prow2{--fc:#888;display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px 10px 11px;margin-bottom:5px;
  background:linear-gradient(90deg,rgba(26,31,40,.95),rgba(20,24,31,.9));border:1px solid var(--line2);border-left:3px solid var(--fc)}

}

function open(on, which = 'log') {
 const L = on && which === 'log', I = on && which === 'inv';
 $('#log').classList.toggle('on', L); $('#inv').classList.toggle('on', I);

 $('#rv-log').setAttribute('aria-pressed', L); $('#rv-inv').setAttribute('aria-pressed', I); $('#rv-menu').setAttribute('aria-pressed', !on);
 $('#backdrop').style.filter = on ? 'blur(3px) brightness(.45) saturate(.8)' : 'none';
 if (I) renderInv();
}
function select(id) {
 SEL = id; const m = MISSIONS.find(x=>x.id===id); if (m && m.status==='new') { /* opening clears New on close-out, kept visible here for review */ }
 renderList(); renderDetail(); $('#log').classList.add('detail');
}

 else if (t.dataset.planet) { ISEL = t.dataset.planet; renderInv(); $('#inv').classList.add('detail'); }
 else if (t.dataset.itab) { ITAB = t.dataset.itab; renderInv(); }
 else if (t.id === 'iback') $('#inv').classList.remove('detail');
 else if (t.id === 'close3') open(false);
 else if (t.id === 'rv-menu' || t.id === 'close2') open(false);
 else if (t.dataset.id) select(t.dataset.id);
 else if (t.dataset.tab) { TAB = t.dataset.tab; renderList(); }
 else if (t.id === 'back') $('#log').classList.remove('detail');
 else if (t.id === 'track') { TRACK.has(SEL) ? TRACK.delete(SEL) : TRACK.add(SEL); renderDetail(); }
 else if (t.id === 'claim') claim(t);
 else if (t.id === 'dismiss') { MISSIONS = MISSIONS.filter(m=>m.id!==SEL); SEL = MISSIONS[0].id; renderList(); renderDetail(); }
 else if (t.id === 'abandon') { const m = MISSIONS.find(x=>x.id===SEL); m.status='failed'; m.failNote='Abandoned by the commander.'; m.terms=[['Result','Abandoned']]; renderList(); renderDetail(); }
 else if (t.id === 'rv-assign') assign();
 else if (t.id === 'rv-advance') advance();
 else if (t.id === 'rv-sheet') { const on = !document.body.classList.contains('show-sheet'); document.body.classList.toggle('show-sheet', on); t.setAttribute('aria-pressed', on); if (on && !$('#sheet').innerHTML) renderSheet(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#log').classList.contains('detail') && innerWidth <= 700) $('#log').classList.remove('detail'); else open(false); } });

function claim(btn) {
 const m = MISSIONS.find(x=>x.id===SEL), b = document.createElement('div'); b.className = 'burst';
 b.innerHTML = Array.from({length:14},(_,i)=>{ const a = i/14*Math.PI*2, d = 90+Math.random()*60; return `<span style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;animation-delay:${i*12}ms"></span>`; }).join('');
 btn.parentElement.style.position = 'relative'; btn.parentElement.appendChild(b);
 setTimeout(() => { m.status = 'done'; m.terms = [['Collected', SHIPS[m.planet].name]]; const nx = MISSIONS.find(x => x.id === NEXT[m.id]); if (nx) { nx.status = 'new'; nx.gates.forEach(q => q.ok = 1); toast(nx); } renderList(); renderDetail(); }, 650);
}
function toast(m) {
 const g = G(m.giver), el = $('#toast');
 el.innerHTML = `<span class="badge" style="--sc:var(--s-new)">${use('t-'+m.type)}</span><span class="tt"><span class="k">MISSION LOGGED · ${m.role==='primary'?'PRIMARY':'SECONDARY'} STEP ${m.step}</span><span class="n">${m.title}</span><span class="g">${g.name}</span>${bar(m)}</span>`;
 el.classList.add('on'); $('#mlbtn').classList.remove('ping'); void $('#mlbtn').offsetWidth; $('#mlbtn').classList.add('ping');
 clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3600);
}
function assign() {
 const m = POOL.shift(); if (!m) return;
 m.status = 'new'; MISSIONS.unshift(m); TAB = 'active'; renderList(); if ($('#log').classList.contains('on')) { SEL = m.id; renderList(); renderDetail(); } toast(m);
}
function advance() {
 for (const m of MISSIONS) if (['active','new','risk'].includes(m.status) && m.role) {
  const o = m.obj.find(o => !o.opt && !o.limit && o.c < o.n); if (!o) continue;
  o.c = Math.min(o.n, o.c + Math.max(1, Math.round(o.n * .2)));
  const it = m.items.find(i => o.t.includes(i.n)); if (it) it.c = o.c;
  if (m.status === 'new') m.status = 'active';
  if (m.obj.every(o => o.opt || o.limit || o.c >= o.n)) m.status = 'ready';
 }
 renderList(); renderDetail();
}

/* ═══════════════════════ INVENTORY ═══════════════════════ */
function renderInv() {
 const owned = (pl) => pl.res.reduce((a, r) => a + (r[1] || 0), 0), fresh = (pl) => pl.res.reduce((a, r) => a + (r[2] || 0), 0);
 const ITABS = [['all','All'],['kept','Kept'],['quest','Quest crystals']];
 $('#itabs').innerHTML = ITABS.map(([k, n]) => `<button class="tab" role="tab" aria-selected="${k===ITAB}" data-itab="${k}">${n}</button>`).join('');
 const tot = PLANETS.reduce((a, pl) => a + owned(pl), 0), nw = PLANETS.reduce((a, pl) => a + fresh(pl), 0);
 $('#isum').innerHTML = `<b class="num">${tot.toLocaleString()}</b> held<br><b class="num">36</b> resources`;
 $('#plist').innerHTML = `<div class="grp">Factions · campaign order</div>` + PLANETS.map(pl => { const f = FACTION[pl.f];
  return `<button class="prow2${pl.open?'':' locked'}" data-planet="${pl.p}" aria-selected="${pl.p===ISEL}" style="--fc:${f.color}">${fsvg(pl.f)}
   <span><b>${pl.p}</b><small>${f.name}${pl.open?'':' · portal not owned'}</small><span class="pips">${pl.res.map((r,i)=>`<i class="${(r[1]||0)>0?'on':''}" style="--c:var(${RAR[TIERS[i]].v})"></i>`).join('')}</span></span>
   <span class="tot num">${pl.open?owned(pl).toLocaleString():use('s-locked')}${fresh(pl)?`<em class="nw">+${fresh(pl)}</em>`:''}</span></button>`; }).join('');
 const pl = PLANETS.find(x => x.p === ISEL), f = FACTION[pl.f];
 const tiles = pl.res.map((r, i) => ({r, t: TIERS[i]})).filter(({t}) => ITAB === 'all' || (ITAB === 'kept') === (t === 'common' || t === 'uncommon')).map(({r, t}) => {
  const [nm, have = 0, nwc = 0] = r, w = WANTED[nm] || [];
  return `<div class="rtile${have?'':' zero'}" style="--rc:var(${RAR[t].v})"><span class="gem2">${use('r-crystal')}</span><span class="cnt num">${pl.open?have.toLocaleString():'—'}</span>${nwc?`<span class="new num">+${nwc} new</span>`:''}
   <b>${nm}</b><small>${RAR[t].n}</small><dl><dt>Role</dt><dd>${ROLE[t]}</dd><dt>From</dt><dd>${pl.p} harvests${t==='rare'||t==='epic'?' (quest nodes)':''}</dd>
   <dt>Wanted by</dt><dd>${w.length?w.join('<br>'):'—'}</dd></dl></div>`; }).join('');
 $('#ipane').innerHTML = `<button class="dback" id="iback">${use('u-back')}All factions</button><div class="ipane" style="--fc:${f.color}">
  <div class="ihead">${fsvg(pl.f)}<div><div class="pl">${pl.p}</div><div class="fx">${f.name} homeworld${SHIPS[pl.p]?` · ${SHIPS[pl.p].name} ${SHIPS[pl.p].arrived?'in orbit':'not yet arrived'}`:''}</div></div>
  <div class="ihtot"><b class="num">${pl.open?owned(pl).toLocaleString():'—'}</b><small>held</small></div></div>
  ${pl.open?'':`<div class="dnote" style="--sc:var(--s-locked);margin-top:12px">${use('s-locked')}Locked: own <b>&nbsp;Portal: ${pl.p}&nbsp;</b> in the Tech Net to campaign here.</div>`}
  <div class="rtiles">${tiles}</div>
  <p class="inote">Common and uncommon resources are kept and can pay for Tech Net nodes that missions unlock. Rare and epic come from quest nodes and fill faction favours.</p></div>`;
 $('#invcount').textContent = '+' + nw; $('#invcount').style.display = nw ? '' : 'none';
}

/* ═══════════════════════ DESIGN SYSTEM SHEET ═══════════════════════ */
function renderSheet() {
 const demo = (st, c, n) => bar({status:st, obj:[{c, n}]});
 const ic = (id, name, note, cls='') => `<div class="ic-card ${cls}"><div class="sizes">${use(id)}${use(id)}${use(id)}</div><b>${name}</b><code>#${id}</code>${note?`<p>${note}</p>`:''}</div>`;
 $('#sheet').innerHTML = `
 <div class="sh-h"><h1>MISSION <span>LOG</span></h1><p>Design system for the Mission Log (MLG-1). Every token here maps onto the shipped “gold on ink” menu. One hue, one glyph and one bar treatment per status, so state never rests on colour alone.</p></div>

 <section class="sh-sec"><h2>STATUS LANGUAGE</h2><p>Seven states. Each pairs a hue with a shape and a bar treatment, ordered the way the list sorts them: what needs you sits at the top. Locked (added with the mission flow) sits below Active.</p>
  <div class="status-grid">${['ready','risk','new','active','locked','failed','done'].map(k=>{const s=STATUS[k];return `<div class="sw" style="--sc:var(${s.v})"><div class="sh"><svg class="glyphbig"><use href="#${s.g}"/></svg><div><b>${s.n}</b><br><code>${getComputedStyle(document.documentElement).getPropertyValue(s.v).trim()} · ${s.v}</code></div></div><p>${s.d}</p>${tag(k)}<div style="height:10px"></div>${demo(k, k==='new'||k==='locked'?0:k==='ready'||k==='done'?6:k==='failed'?3:4, 6)}</div>`;}).join('')}</div></section>

 <section class="sh-sec"><h2>PROGRESS BARS</h2><p>Up to 14 units the bar is segmented, one cell per thing to collect, so “7 of 12” reads at a glance. Above that it turns continuous with quarter ticks. Ready shimmers (the only idle motion in the log), At risk is hazard-striped, and Failed hatches what was never reached.</p>
  <div style="display:grid;gap:14px;max-width:560px">${demo('active',7,12)}${demo('ready',6,6)}${demo('risk',2,3)}${demo('failed',5,10)}${demo('active',26,40)}${demo('done',8,8)}</div></section>

 <section class="sh-sec"><h2>MISSION TYPES</h2><p>Seven types, each drawn on the 24-unit grid with a 1.6 stroke to match the shipped faction icons. In the list they sit in a hex badge tinted by status, echoing the rank hex and the Bulwark crest.</p>
  <div class="icon-grid">${Object.entries(TYPES).map(([k,t])=>ic('t-'+k,t.n,t.d,'gold')).join('')}</div></section>

 <section class="sh-sec"><h2>REWARD KINDS</h2><p>Rewards keep their economy colours from the header (gold, cyan XP and research, star yellow). Loyalty takes the giving faction's accent, and resources take their rarity colour.</p>
  <div class="icon-grid">${Object.entries(REWARD).map(([k,r])=>`<div class="ic-card" style="--x:1"><div class="sizes" style="color:${r.col||'#d6dde6'}">${use(r.i)}${use(r.i)}${use(r.i)}</div><b>${r.n}</b><code>#${r.i}</code></div>`).join('')}</div></section>

 <section class="sh-sec"><h2>HEADER AND STATUS GLYPHS</h2><p>The ledger glyph opens the log. The status glyphs are drawn on a 12-unit grid so they stay crisp at 10 px inside tags.</p>
  <div class="icon-grid">${ic('i-log','Mission Log','Header button, list header, empty state','gold')}${ic('i-inv','Inventory','Header button next to Missions','cyan')}${Object.entries(STATUS).map(([k,s])=>`<div class="ic-card"><div class="sizes" style="color:var(${s.v})">${use(s.g)}${use(s.g)}${use(s.g)}</div><b>${s.n}</b><code>#${s.g}</code></div>`).join('')}</div></section>

 <section class="sh-sec"><h2>RESOURCE RARITY</h2><p>Required items use the crystal colours already used in the world and on the survey dossier.</p>
  <div class="rar">${Object.entries(RAR).map(([k,r])=>`<div class="item" style="--rc:var(${r.v})"><span class="gem">${use('r-crystal')}</span><span><b>${r.n}</b><small>${getComputedStyle(document.documentElement).getPropertyValue(r.v).trim()}</small></span></div>`).join('')}</div></section>

 <section class="sh-sec"><h2>ALIGNMENT RAIL</h2><p>The giver's place on the GDD §10 axis. Nine steps, good to evil; the giver's step is raised and lit. The Unknown Contact shows an unlit rail.</p>
  <div class="align-sheet">${ALIGN.map(a=>`<div style="--c:${a.col}"><b>${a.c}</b>${a.n}<br><small>${a.t}</small></div>`).join('')}</div></section>

 <section class="sh-sec"><h2>MISSION ROW ANATOMY</h2><div class="anatomy"><div class="demo-row">${row(MISSIONS.find(m=>m.id==='m4')||MISSIONS[0])}</div>
  <ol><li><span><b>Type badge.</b> Hex tinted by status; the glyph names the mission type.</span></li><li><span><b>Title and giver.</b> Faction icon in the faction accent, then giver and planet.</span></li>
  <li><span><b>Status tag.</b> Glyph, word and hue. Ready is filled solid so it is the loudest thing in the list.</span></li><li><span><b>Reward icons.</b> First three rewards, then +N.</span></li>
  <li><span><b>Progress.</b> Segmented bar and count; Ready, Broken and Done replace the count with a word.</span></li><li><span><b>Status edge.</b> The 3 px left edge carries the status hue so the list scans as a column of colour.</span></li></ol></div></section>

 <section class="sh-sec"><h2>TYPE</h2><p>The shipped UI face (Segoe UI / system-ui), heavy weights, wide tracking on labels, tabular figures for every count.</p>
  <div class="type-scale"><div><span style="font-size:34px;font-weight:900">Rootsong</span><small>Dossier title · 34 / 900</small></div><div><span style="font-size:22px;font-weight:900;letter-spacing:.24em">MISSION LOG</span><small>Screen title · 22 / 900 / .24em</small></div>
  <div><span style="font-size:14.5px;font-weight:800">Silk for the Wings</span><small>Row title · 14.5 / 800</small></div><div><span style="font-size:10px;font-weight:900;letter-spacing:.3em;color:var(--dim)">OBJECTIVES</span><small>Section label · 10 / 900 / .3em</small></div>
  <div><span style="font-size:14px;font-style:italic;color:#c9d3de">“Bring every kid home.”</span><small>Giver's voice · 14 italic</small></div><div><span class="num" style="font-size:22px;font-weight:900;color:var(--s-ready)">100%</span><small>Progress figure · 22 / 900, tabular</small></div></div></section>`;
}

/* boot */
if (BACKDROP) $('#backdrop').style.backgroundImage = `url(${BACKDROP})`;
renderList(); renderDetail(); open(true);
if (innerWidth <= 700) $('#log').classList.remove('detail');
const q = new URLSearchParams(location.search);
if (q.get('view') === 'sheet') $('#rv-sheet').click();
if (q.get('view') === 'menu') open(false);
if (q.get('view') === 'inv') open(true, 'inv');
if (q.get('planet')) { ISEL = q.get('planet'); renderInv(); }
if (q.get('sel')) select(q.get('sel'));
if (q.get('tab')) { TAB = q.get('tab'); renderList(); }
if (q.get('toast')) setTimeout(assign, 300);
</script>
</body>
</html>
