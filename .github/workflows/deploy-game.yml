# Publish the Bulwark test-game to GitHub Pages on every push to main that touches it.
# ONLY prototype/test-game ships (the game is fully static) — docs/design/art stay repo-only.
# Play URL: https://rburnett66.github.io/Bulwark-Metamax/
name: Deploy game to Pages
on:
  # DEPLOY ONLY. Owner rule (2026-10-18): no CI on GitHub — Actions minutes are billed. Tests run LOCALLY before
  # every push (.githooks/pre-push; `npm test`); this workflow only publishes main to Pages. There is deliberately
  # no pull_request trigger and no test job. [MM-task_mvds0iae_p]
  push:
    branches: [main]
    paths: ['prototype/test-game/**', '.github/workflows/deploy-game.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # PUBLISH ONLY FROM main (push or a manual run); the suite has already passed locally before the push.
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/test-game
      - id: deployment
        uses: actions/deploy-pages@v4
