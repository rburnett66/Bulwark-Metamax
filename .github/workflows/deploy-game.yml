# Publish the Bulwark test-game to GitHub Pages on every push to main that touches it.
# ONLY prototype/test-game ships (the game is fully static) — docs/design/art stay repo-only.
# Play URL: https://rburnett66.github.io/Bulwark-Metamax/
name: Deploy game to Pages
on:
  push:
    branches: [main]
    paths: ['prototype/test-game/**', '.github/workflows/deploy-game.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    # Data-contract gates (rendering-tiers spec §5): a Tier C unit whose wave data can exceed
    # MAX_LIVE_3D, or a unit without an explicit render_tier, fails the build before it ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Render-tier + pack contract: a Tier C unit whose wave data can exceed MAX_LIVE_3D fails the build.
      - run: node --test prototype/test-game/src/data/renderTiers.test.mjs prototype/test-game/src/render/voxel/pack.test.mjs
      # Stack Forge cores. carve.js and select.js are the code the tool actually runs; audit.test.mjs
      # fails on dead code, on a handler bound to a missing element, on the cores not being loaded, and
      # on the front facing disagreeing with itself. Passing locally was never a gate -- this is.
      - run: node --test prototype/test-game/tools/voxel-stack/carve.test.mjs prototype/test-game/tools/voxel-stack/select.test.mjs prototype/test-game/tools/voxel-stack/audit.test.mjs
      # palette.js decides which colours survive a reduction to 2/4/8/16/32/48. Its own header made a
      # claim that was false -- a 1-voxel stray could take a slot in a 4-colour palette -- so these
      # tests assert the claims, and the suite is mutation-checked rather than merely green.
      - run: node --test prototype/test-game/tools/voxel-stack/palette.test.mjs
      # BOOT GATE. The suites above exercise pure functions; node --check only proves the file parses.
      # Neither runs module scope -- which is where five separate dead-on-arrival ships came from: an
      # out-of-scope binding, a TDZ read, and a null deref on frame one. This runs the real boot path
      # against a stubbed DOM/PIXI and drives one ticker frame, so those faults fail here, not on the
      # owner's screen.
      - run: node --test prototype/test-game/tools/voxel-stack/boot.test.mjs
      # ART IS SIZED TO MATCH COLLISION (sprite = collision x 4/3), not the reverse. This test guards
      # that relationship and was RED in the repo for weeks -- it asserted a magnitude ("radius > 1")
      # that a balance retune was always free to change, and it sat in no gate, so nothing reported it.
      - run: node --test prototype/test-game/src/render/unitart-scale.test.mjs
      # ATLAS DIMENSIONS of the real shipped packs. An atlas past the device MAX_TEXTURE_SIZE does not
      # throw -- WebGL refuses the upload and the unit renders as nothing, on that device only, so a
      # desktop never sees it. Live since body frames went 16 -> 32: atlas area scales with frame count.
      # This is also the first CI test that reads content/ at all.
      - run: node --test prototype/test-game/src/render/voxel/atlasSize.test.mjs
      # THE FACTION REGISTRY, checked against tables.js, content/units/ and voicepacks.json rather than
      # against itself. A wrong prefix here would be worse than the guessing it replaces, because it
      # would look authoritative. Six of nine prefixes were wrong before this existed.
      - run: node --test prototype/test-game/src/data/factions.test.mjs
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/test-game
      - id: deployment
        uses: actions/deploy-pages@v4
