# Publish the Bulwark test-game to GitHub Pages on every push to main that touches it.
# ONLY prototype/test-game ships (the game is fully static) — docs/design/art stay repo-only.
# Play URL: https://rburnett66.github.io/Bulwark-Metamax/
name: Deploy game to Pages
on:
  push:
    branches: [main]
    paths: ['prototype/test-game/**', '.github/workflows/deploy-game.yml']
  # TESTS MUST RUN ON THE PR, NOT AFTER THE MERGE. This workflow used to trigger on push-to-main only,
  # so a pull request had NO checks at all -- the suite ran once the change was already on main, which is
  # exactly too late to block it. Opening PR #19 with a green tick and zero checks is what surfaced it.
  # No `paths:` filter here on purpose: a PR that touches only the workflow, or only content, should
  # still be gated, and a skipped required check blocks a merge rather than passing it.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    # Data-contract gates (rendering-tiers spec §5): a Tier C unit whose wave data can exceed
    # MAX_LIVE_3D, or a unit without an explicit render_tier, fails the build before it ships.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # EVERY TEST FILE, ENUMERATED AT RUN TIME.
      #
      # This used to be a hand-maintained list of individual suites, and it fell behind badly: 49 test
      # files existed on disk and 11 were gated. The ENTIRE simulation -- combat, waves, harvest, mapgen,
      # replay, separation, contact -- ran on nobody's machine but the author's. Two suites were found
      # red in the repo, one of them for weeks (unitart-scale asserted a magnitude a balance retune had
      # long since changed), and handlers.test.mjs called itself "HANDLER GATE" in its own header while
      # being in no job at all.
      #
      # A list you have to remember to append to is a list that rots. `find` cannot forget: a new
      # *.test.mjs is gated the moment it lands, which is the only property that actually holds.
      #
      # Not `node --test <dir>` -- that fails to discover these files. Not a `**` glob -- that needs
      # shopt -s globstar and would silently under-match here rather than erroring.
      #
      # The contracts this protects, unchanged: a unit without an explicit render_tier, or a Tier C unit
      # whose wave data can exceed MAX_LIVE_3D, still fails the build before it ships.
      - run: node --test $(find prototype/test-game/src prototype/test-game/tools -name '*.test.mjs' | sort)
  deploy:
    needs: test
    # PUBLISH ONLY FROM main. Without this a pull_request run would push a PR branch to Pages and
    # overwrite the live game with unreviewed work -- the tests would gate the merge while the deploy
    # had already shipped it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototype/test-game
      - id: deployment
        uses: actions/deploy-pages@v4
