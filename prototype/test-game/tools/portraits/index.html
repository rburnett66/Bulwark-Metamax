<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portraits — Bulwark</title>
<!--
  tools/portraits/index.html — the RELATIONSHIP PORTRAIT review page [MM-story_mwpni0v4_3m].
  Owner 2026-11-20: "strengthen the character creation tool for images. The character should all have 3 portraits
  invoking relationship as neutral, friendly, or antagonistic. These can be swapped into dialogs based on friend level.
  Even an angry character could appear neutral if given the right info or gift."
  Data: prompts.json, written by tools/dialog/expression_prompts.py (re-run it after adding art). The "game shows"
  highlight uses the game's own moodFor (src/save/standings.js), so this page and the game never disagree.
-->
<style>
:root{--bg:#0b1118;--panel:#111b26;--line:#24384f;--ink:#dbe7f0;--dim:#7f9bb3;--ok:#5fd38a;--bad:#ff7a6b;--warn:#f2c869;--accent:#3fb6c8;
  --ant:#ff7a6b;--neu:#9fb4c8;--fri:#5fd38a}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:37px;z-index:5}
.bar label{color:var(--dim);display:flex;gap:6px;align-items:center}
.bar select,.bar input{background:#0b141d;color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:3px 6px;font:inherit}
.sum{margin-left:auto;color:var(--dim)}
main{padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
@media (max-width:480px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.card h3{margin:0;font-size:14px}
.meta{color:var(--dim);font-size:12px;margin:2px 0 8px}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.flag{font-size:11px;padding:1px 6px;border-radius:9px;border:1px solid var(--line);color:var(--warn)}
.flag.ok{color:var(--ok)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.slot .pic{aspect-ratio:3/4;border-radius:6px;background:#0b141d;border:2px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:11px;text-align:center}
.slot .pic img{width:100%;height:100%;object-fit:cover;display:block}
.slot.on .pic{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.slot .nm{font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.slot.antagonistic .nm{color:var(--ant)} .slot.neutral .nm{color:var(--neu)} .slot.friendly .nm{color:var(--fri)} .slot.base .nm{color:var(--dim)}
.slot .st{font-size:10.5px;color:var(--dim);min-height:1.3em}
.slot .st.bad{color:var(--bad)} .slot .st.ok{color:var(--ok)}
.slot button{background:#16273a;border:1px solid #2f4a66;color:var(--ink);border-radius:5px;font:inherit;font-size:11px;padding:3px 4px;cursor:pointer}
.slot button:hover{background:#1e3a49}
.empty{padding:40px;color:var(--dim)}
</style>
</head>
<body>
<script src="../toolhead.js"></script>
<div class="bar">
  <label>Faction <select id="fac"><option value="">All</option></select></label>
  <label>Show <select id="show"><option value="all">All</option><option value="todo">Missing a portrait</option><option value="ready">All three ready</option><option value="base">Base art problems</option></select></label>
  <label>Rating <input id="score" type="range" min="-100" max="100" step="5" value="0"><b id="scoreV">0</b></label>
  <label>Mood shift <select id="shift"><option value="">None</option><option value="gift">Gift (+1)</option><option value="info">News (+1)</option><option value="kept">Promise kept (+1)</option><option value="broken">Promise broken (−1)</option><option value="slight">Slighted (−1)</option></select></label>
  <span class="sum" id="sum"></span>
</div>
<main id="grid"><div class="empty">Loading prompts.json…</div></main>
<script type="module">
import { rapportBand, moodFor, MOOD_SHIFTS } from '../../src/save/standings.js';

ToolHead.mount({ tool: 'portraits', title: 'Relationship portraits' });
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ROOT = '../../';
let data = null;

function gameMood() {
  const score = +$('score').value, sh = MOOD_SHIFTS[$('shift').value];
  return moodFor(rapportBand(score, true).key, sh ? sh.step : 0);
}

function slot(kind, label, src, status, prompt) {
  return `<div class="slot ${kind}" data-kind="${kind}">
    <div class="pic"><img alt="" src="${esc(ROOT + src)}" data-src="${esc(src)}" onerror="this.parentNode.textContent='missing'"></div>
    <span class="nm">${label}</span><span class="st">${esc(status)}</span>
    ${prompt ? `<button data-prompt="${esc(prompt)}">Copy prompt</button>` : ''}</div>`;
}

function card(c) {
  const flags = c.baseProblems.length ? c.baseProblems.map((p) => `<span class="flag">${esc(p)}</span>`).join('')
    : '<span class="flag ok">base art final</span>';
  return `<article class="card"><h3>${esc(c.name)}</h3>
    <div class="meta">${esc(c.factionName)} · ${esc(c.alignName)} · ${esc(c.personality)} <span title="${esc(c.personalitySource)}">ⓘ</span></div>
    <div class="flags">${flags}</div>
    <div class="row">${slot('base', 'Base', c.base, '', '')}
      ${data.moods.map((m) => slot(m, m, c.moods[m].file, c.moods[m].problems.join(', ') || 'ready', c.moods[m].prompt)).join('')}</div></article>`;
}

function render() {
  const fac = $('fac').value, show = $('show').value;
  const list = data.characters.filter((c) => (!fac || c.faction === fac)
    && (show === 'all' || (show === 'ready' && c.ready) || (show === 'todo' && !c.ready) || (show === 'base' && c.baseProblems.length)));
  $('grid').innerHTML = list.length ? list.map(card).join('') : '<div class="empty">Nothing matches.</div>';
  const ready = data.characters.filter((c) => c.ready).length;
  $('sum').textContent = `${ready} of ${data.characters.length} characters have all three · showing ${list.length}`;
  highlight();
  // live size check: the file on disk may be newer than prompts.json
  for (const img of $('grid').querySelectorAll('.slot:not(.base) img')) {
    img.addEventListener('load', () => {
      const st = img.closest('.slot').querySelector('.st');
      const okSize = img.naturalWidth === data.size[0] && img.naturalHeight === data.size[1];
      st.textContent = okSize ? 'ready' : `${img.naturalWidth}×${img.naturalHeight}, not ${data.size[0]}×${data.size[1]}`;
      st.className = 'st ' + (okSize ? 'ok' : 'bad');
    });
  }
}

function highlight() {
  const m = gameMood();
  $('scoreV').textContent = `${$('score').value} · ${rapportBand(+$('score').value, true).label} → ${m}`;
  for (const s of document.querySelectorAll('.slot')) s.classList.toggle('on', s.dataset.kind === m);
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-prompt]');
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.prompt); b.textContent = 'Copied'; } catch (err) { b.textContent = 'Copy failed'; }
  setTimeout(() => { b.textContent = 'Copy prompt'; }, 1200);
});
for (const id of ['fac', 'show']) $(id).addEventListener('change', render);
for (const id of ['score', 'shift']) $(id).addEventListener('input', highlight);

try {
  data = await (await fetch('prompts.json', { cache: 'no-store' })).json();
  const facs = [...new Map(data.characters.map((c) => [c.faction, c.factionName])).entries()];
  $('fac').insertAdjacentHTML('beforeend', facs.map(([k, n]) => `<option value="${esc(k)}">${esc(n)}</option>`).join(''));
  render();
} catch (e) {
  $('grid').innerHTML = '<div class="empty">No prompts.json. Run: python tools/dialog/expression_prompts.py</div>';
}
</script>
</body>
</html>
