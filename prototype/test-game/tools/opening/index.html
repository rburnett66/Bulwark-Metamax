<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collective Opening — review</title>
<!-- [MM-story_mw47lhgr_4] [MM-story_mw47l791_1] Review page for the opening: Vesper, the fly-by of The Long Ledger and
     the swing to its flank, scrubbable. Serve the game folder and open tools/opening/ (outside Claude, owner rule).
     ?t=24 starts at 24 s · ?play=0 holds · ?tier=low|standard|high · ?reduced=1 · ?frame=portrait|landscape -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #e9e2d6; --dim: #9b8f80; --gold: #f2c869; --ember: #ff7a3c; --panel: rgba(14, 9, 8, 0.78); --line: rgba(242, 200, 105, 0.28); }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font: 14px/1.4 "IBM Plex Sans Condensed", system-ui, sans-serif; overflow: hidden; }
  #view { position: fixed; inset: 0; }
  body.portrait #view { inset: 50% auto auto 50%; width: min(390px, 100vw); height: min(844px, 100vh - 80px); transform: translate(-50%, calc(-50% - 30px)); outline: 1px solid var(--line); }
  body.landscape #view { inset: 50% auto auto 50%; width: min(844px, 100vw); height: min(390px, 100vh - 80px); transform: translate(-50%, calc(-50% - 30px)); outline: 1px solid var(--line); }
  canvas { display: block; width: 100%; height: 100%; }
  #fade { position: absolute; inset: 0; background: #000; pointer-events: none; }
  #caption { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font: 600 clamp(14px, 2.2vw, 22px) "Chakra Petch", sans-serif;
    letter-spacing: .42em; color: var(--gold); text-shadow: 0 0 18px rgba(255, 122, 60, 0.45); pointer-events: none; padding-left: .42em; }
  #skip { position: absolute; right: 16px; top: 16px; display: none; font: 600 12px "Chakra Petch", sans-serif; letter-spacing: .16em;
    color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  #skip.on { display: block; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel);
    border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
  button.tb { font: 600 13px "Chakra Petch", sans-serif; color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; min-width: 44px; min-height: 32px; }
  button.tb[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .track { position: relative; height: 34px; }
  .track input { position: absolute; inset: 14px 0 auto; width: 100%; margin: 0; accent-color: var(--ember); }
  .beat { position: absolute; top: 0; font-size: 11px; color: var(--dim); white-space: nowrap; transform: translateX(-1px); border-left: 1px solid var(--line); padding-left: 4px; line-height: 12px; }
  .beat.on { color: var(--gold); border-color: var(--gold); }
  .beat.later { opacity: .45; }
  .right { display: flex; gap: 8px; align-items: center; color: var(--dim); font-variant-numeric: tabular-nums; }
  #stats { position: fixed; left: 16px; top: 14px; font-size: 12px; color: var(--dim); pointer-events: none; }
  @media (max-width: 640px) { .beat { display: none; } .beat.on { display: block; } .right .opt { display: none; } }
</style>
</head>
<body>
<div id="view"><canvas id="c"></canvas><div id="fade"></div><div id="caption"></div>
  <button id="skip" type="button">SKIP ▸</button></div>
<div id="stats"></div>
<div class="bar">
  <button class="tb" id="play" type="button" aria-label="Play or pause">❚❚</button>
  <div class="track"><div id="beats"></div><input id="scrub" type="range" min="0" max="46" step="0.01" value="0" aria-label="Time"></div>
  <div class="right"><span id="time">0.0 s</span>
    <button class="tb opt" id="reduced" type="button" aria-pressed="false">Reduced</button>
    <button class="tb opt" data-frame="portrait" type="button" aria-pressed="false">Portrait</button>
    <button class="tb opt" data-frame="landscape" type="button" aria-pressed="false">Phone</button>
    <button class="tb opt" id="tier" type="button"></button></div>
</div>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/three-addons/loaders/GLTFLoader.js';
import { EffectComposer } from '../../vendor/three-addons/postprocessing/EffectComposer.js';
import { RenderPass } from '../../vendor/three-addons/postprocessing/RenderPass.js';
import { ShaderPass } from '../../vendor/three-addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from '../../vendor/three-addons/postprocessing/UnrealBloomPass.js';
import { createOpeningStage } from '../../src/opening/openingStage.js';
import { BEATS, SHIP_UNTIL, skipTarget } from '../../src/opening/timeline.js';

const q = new URLSearchParams(location.search);
const tier = ['high', 'standard', 'low'].includes(q.get('tier')) ? q.get('tier') : 'high';
const reduced = q.get('reduced') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches;
if (q.get('frame')) document.body.classList.add(q.get('frame'));
const view = document.getElementById('view'), canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: q.has('shot') });
renderer.setPixelRatio(Math.min(devicePixelRatio, tier === 'low' ? 1 : tier === 'standard' ? 1.5 : 2));
renderer.info.autoReset = false;
const stage = createOpeningStage(THREE, { renderer, addons: { GLTFLoader, EffectComposer, RenderPass, ShaderPass, UnrealBloomPass }, tier, reduced });

const manifest = await (await fetch('../../content/ships/ships.json')).json();
await stage.load({ ship: '../../content/ships/' + manifest.collective.lods[tier === 'low' ? 1 : 0].file,
  tug: manifest.tug ? '../../content/ships/' + manifest.tug.lods[0].file : null, engineColor: manifest.collective.engineColor });

// controls
const END = 46, scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play');
const beatsEl = document.getElementById('beats');
for (const b of BEATS) {
  if (b.start > END) continue;
  const m = document.createElement('span'); m.className = 'beat' + (b.start >= SHIP_UNTIL ? ' later' : '');
  m.textContent = b.id; m.style.left = (b.start / END * 100) + '%'; m.dataset.id = b.id; beatsEl.appendChild(m);
}
let t = q.has('t') ? +q.get('t') : 0, playing = q.get('play') !== '0';
const setPlay = (on) => { playing = on; playBtn.textContent = on ? '❚❚' : '▶'; };
setPlay(playing);
playBtn.onclick = () => { if (t >= END) t = 0; setPlay(!playing); };
scrub.oninput = () => { t = +scrub.value; };
document.getElementById('skip').onclick = () => { const to = skipTarget(t); if (to != null) t = Math.min(to, END); };
const rBtn = document.getElementById('reduced'); rBtn.setAttribute('aria-pressed', reduced);
rBtn.onclick = () => { q.set('reduced', reduced ? '0' : '1'); q.set('t', t.toFixed(2)); location.search = q; };
document.querySelectorAll('[data-frame]').forEach((b) => {
  b.setAttribute('aria-pressed', q.get('frame') === b.dataset.frame);
  b.onclick = () => { q.get('frame') === b.dataset.frame ? q.delete('frame') : q.set('frame', b.dataset.frame); q.set('t', t.toFixed(2)); location.search = q; };
});
const tierBtn = document.getElementById('tier'); tierBtn.textContent = tier;
tierBtn.onclick = () => { const order = ['high', 'standard', 'low']; q.set('tier', order[(order.indexOf(tier) + 1) % 3]); q.set('t', t.toFixed(2)); location.search = q; };
addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); playBtn.click(); } });

function resize() { const r = view.getBoundingClientRect(); stage.resize(r.width, r.height); }
addEventListener('resize', resize); resize();

const fadeEl = document.getElementById('fade'), capEl = document.getElementById('caption'), skipEl = document.getElementById('skip'), statsEl = document.getElementById('stats');
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) { t += dt; if (t >= END) { t = END; setPlay(false); } }
  renderer.info.reset();
  const o = stage.frame(t, playing ? dt : 0);
  if (!o) return;
  fadeEl.style.opacity = (1 - o.fade).toFixed(3);
  capEl.textContent = o.caption.text; capEl.style.opacity = o.caption.alpha.toFixed(3);
  skipEl.classList.toggle('on', skipTarget(t) != null);
  scrub.value = t; timeEl.textContent = t.toFixed(1) + ' s';
  for (const m of beatsEl.children) m.classList.toggle('on', m.dataset.id === o.beat);
  const i = stage.info;
  statsEl.textContent = `${o.beat}${t < SHIP_UNTIL ? '' : ' · the rooms (beats 4–8) play in the game: index.html?intro=1'} · ${i.calls} draws · ${(i.triangles / 1000).toFixed(1)}k tris · ${tier}${reduced ? ' · reduced' : ''}`;
});
window.__ready = true;
window.__seek = (s) => { t = s; setPlay(false); };
</script>
</body>
</html>
