<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bulwark Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root { --bg: #eef0f2; --pv-panel: #ffffff; --pv-text: #14181d; --pv-mute: #5d6670; --pv-line: #d5dae0; --pv-accent: #e8731c; --pv-chip: #f3f5f7; --stage: #dfe3e7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0e10; --pv-panel: #13181b; --pv-text: #e6ecef; --pv-mute: #8b979e; --pv-line: #243037; --pv-accent: #ff9a4a; --pv-chip: #182026; --stage: #0f1416; } }
:root[data-theme="dark"] { --bg: #0b0e10; --pv-panel: #13181b; --pv-text: #e6ecef; --pv-mute: #8b979e; --pv-line: #243037; --pv-accent: #ff9a4a; --pv-chip: #182026; --stage: #0f1416; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--pv-text); font: 13px/1.45 "JetBrains Mono", ui-monospace, monospace; }
.app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; height: 100dvh; }
aside { background: var(--pv-panel); border-right: 1px solid var(--pv-line); overflow-y: auto; padding: 16px 16px 28px; }
h1 { font: 700 26px/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 2px; }
.sub { color: var(--pv-mute); font-size: 11px; margin-bottom: 14px; }
.stagewrap { position: relative; background: var(--stage); min-height: 0; }
@media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: 56vh 1fr; } .stagewrap { order: -1; } aside { border-right: 0; border-top: 1px solid var(--pv-line); } }
</style>
</head>
<body>
<!-- Standalone copy of a Terrain Forge preview mode (terrain.html → Resources). Same module, bundled by build.py. [MM-story_mvbpfb1b_k] -->
<div class="app">
  <aside><h1>Resources</h1><div class="sub">9 homeworlds × 4 tiers · also in the Terrain Forge (💎 Resources)</div><div id="panel"></div></aside>
  <div class="stagewrap" id="stage"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*__BUNDLE__*/</script>
<script>
const pv = LC.mountResourcePreview(THREE, { stage: document.getElementById('stage'), panel: document.getElementById('panel') });
pv.start();
window.__res = pv.debug;
</script>
</body>
</html>
