<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bulwark Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root { --bg: #eef0f2; --panel: #ffffff; --ink: #14181d; --mute: #5d6670; --line: #d5dae0; --accent: #e8731c; --chip: #f3f5f7; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0b0e10; --panel: #13181b; --ink: #e6ecef; --mute: #8b979e; --line: #243037; --accent: #ff9a4a; --chip: #182026; } }
:root[data-theme="dark"] { --bg: #0b0e10; --panel: #13181b; --ink: #e6ecef; --mute: #8b979e; --line: #243037; --accent: #ff9a4a; --chip: #182026; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 "JetBrains Mono", ui-monospace, monospace; }
header { padding: 12px 16px 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
h1 { font: 700 24px/1 "Barlow Condensed", sans-serif; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 5px; background: var(--chip); color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; color: var(--mute); font-size: 12px; }
.wrap { position: relative; height: calc(100vh - 118px); height: calc(100dvh - 118px); min-height: 320px; }
#stage { position: absolute; inset: 0; }
canvas { display: block; width: 100%; height: 100%; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translate(-50%, 0); text-align: center; width: 180px; }
.lab b { display: block; font: 600 16px/1.1 "Barlow Condensed", sans-serif; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
.lab span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
.lab.small b { font-size: 12px; } .lab.small span { font-size: 9px; }
.note { position: absolute; left: 16px; bottom: 12px; right: 16px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1>Resources · 9 homeworlds × 4</h1>
  <div class="seg" id="planets"></div>
  <div class="row"><label>Field <input type="range" id="drain" min="0" max="4" step="1" value="4"> <span id="drainv">full</span></label>
    <label><input type="checkbox" id="spin" checked> Turntable</label><label><input type="checkbox" id="rings" checked> Role rings</label></div>
</header>
<div class="wrap"><div id="stage"></div><div id="labels"></div><div class="note" id="note"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*__BUNDLE__*/</script>
<script>
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const L = LC.WORLD_LIGHT.meadow;
renderer.setClearColor(0x6f90d4, 1);
scene.add(new THREE.HemisphereLight(L.hemi[0], L.hemi[1], L.hemi[2]), new THREE.AmbientLight(0xffffff, 0.2));
const sun = new THREE.DirectionalLight(L.sun[0], L.sun[1]); sun.position.set(-4, 7, 3); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12 }); scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0x5cbf6c })); ground.receiveShadow = true; scene.add(ground);
const litMat = new THREE.MeshLambertMaterial({ vertexColors: true }), glowMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const ringGeo = new THREE.RingGeometry(0.36, 0.45, 24).rotateX(-Math.PI / 2);
const TIER_RING = { common: 'blue', uncommon: 'yellow', rare: 'red', epic: 'green' };
const TIER_LABEL = { common: 'Common · harvest', uncommon: 'Uncommon · 2× value', rare: 'Rare · associate', epic: 'Epic · associate' };
const planets = Object.keys(LC.PLANETS);
let mode = 'ground', items = [], cam = new THREE.PerspectiveCamera(32, 1, 0.1, 200);

function clear() { for (const it of items) { scene.remove(it.g); it.g.traverse((o) => { if (o.geometry && o.geometry !== ringGeo) o.geometry.dispose(); }); } items = []; $('labels').innerHTML = ''; }
function addModel(planet, tier, x, z, small) {
  const def = LC.resourceModel(planet, tier), m = LC.mergeResourceModel(THREE, def);
  const g = new THREE.Group(), spin = new THREE.Group(); g.position.set(x, 0, z); g.add(spin);
  for (const [geo, mat] of [[m.lit, litMat], [m.glow, glowMat]]) if (geo) { const mesh = new THREE.Mesh(geo, mat); mesh.castShadow = mesh.receiveShadow = mat === litMat; spin.add(mesh); }
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: LC.CRYSTAL[TIER_RING[tier]], transparent: true, opacity: 0.85, depthWrite: false })); ring.position.y = 0.02; g.add(ring);
  scene.add(g);
  const lab = document.createElement('div'); lab.className = 'lab' + (small ? ' small' : '');
  lab.innerHTML = `<b>${def.name}</b><span style="color:${LC.CRYSTAL[TIER_RING[tier]]}">${small ? tier : TIER_LABEL[tier]}</span>`; $('labels').appendChild(lab);
  items.push({ g, spin, ring, lab, def, tris: m.tris });
}
function build() {
  clear();
  if (mode === 'all') {
    planets.forEach((p, c) => LC.TIERS.forEach((t, r) => addModel(p, t, (c - 4) * 1.3, (r - 1.5) * 1.35, true)));
    $('note').textContent = '36 models · columns = homeworlds (' + planets.map((p) => LC.PLANETS[p].name).join(', ') + ') · rows = common, uncommon, rare, epic';
  } else {
    LC.TIERS.forEach((t, c) => addModel(mode, t, (c - 1.5) * 1.6, 0, false));
    const P = LC.PLANETS[mode];
    $('note').textContent = `${P.name} — ${P.type}. ${items.reduce((a, i) => a + i.tris, 0).toLocaleString()} triangles for all four (each drawn instanced: 2 calls per model in the game).`;
  }
  applyDrain();
}
function applyDrain() {
  const q = +$('drain').value / 4; $('drainv').textContent = q === 1 ? 'full' : q === 0 ? 'regrowing stub' : Math.round(q * 100) + '%';
  const s = q === 0 ? 0.4 : 0.6 + 0.4 * q, dim = q === 0 ? 0.45 : 1;
  for (const it of items) { it.spin.scale.setScalar(s); it.spin.traverse((o) => { if (o.isMesh) o.material = dim < 1 ? dimMat(o.material) : (o.material.userData.base || o.material); }); it.ring.visible = $('rings').checked; it.ring.material.color.set(LC.CRYSTAL[TIER_RING[it.def.tier]]).multiplyScalar(dim < 1 ? 0.5 : 1); }
}
const dimCache = new Map();
function dimMat(m) { const base = m.userData.base || m; if (!dimCache.has(base)) { const d = base.clone(); d.color = new THREE.Color(0.45, 0.45, 0.45); d.userData.base = base; dimCache.set(base, d); } return dimCache.get(base); }
const segBtns = [['all', 'All 36'], ...planets.map((p) => [p, LC.PLANETS[p].name])];
for (const [k, label] of segBtns) { const b = document.createElement('button'); b.textContent = label; b.setAttribute('aria-pressed', k === mode); b.onclick = () => { [...$('planets').children].forEach((c) => c.setAttribute('aria-pressed', c === b)); mode = k; build(); }; $('planets').appendChild(b); }
$('drain').oninput = applyDrain; $('rings').onchange = applyDrain;
function resize() { const w = stage.clientWidth || 1, h = stage.clientHeight || 1; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
window.addEventListener('resize', resize);
const v = new THREE.Vector3();
let last = performance.now(), t = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; if ($('spin').checked) t += dt;
  const w = stage.clientWidth, h = stage.clientHeight;
  // fit the layout's width to the screen: half-width / (tan(fov/2) · aspect), and keep the height in view on tall screens
  const half = mode === 'all' ? 6.1 : 2.95, tanH = Math.tan(cam.fov * Math.PI / 360), d = Math.max(half / (tanH * cam.aspect), mode === 'all' ? 3.6 / tanH : 1.2 / tanH);
  if (mode === 'all') { cam.position.set(0, d * 0.78, d * 0.62); cam.lookAt(0, 0, 0.1); } else { cam.position.set(0, d * 0.5, d * 0.87); cam.lookAt(0, 0.25, 0); }
  items.forEach((it, i) => { it.spin.rotation.y = t * 0.5 + i * 0.7; v.set(it.g.position.x, mode === 'all' ? -0.1 : -0.12, it.g.position.z + (mode === 'all' ? 0.42 : 0.55)).project(cam); it.lab.style.left = ((v.x + 1) / 2 * w) + 'px'; it.lab.style.top = ((1 - v.y) / 2 * h) + 'px'; });
  renderer.render(scene, cam); requestAnimationFrame(frame);
}
window.__res = { set(k, d) { mode = k; if (d != null) $('drain').value = d; build(); } };
build(); resize(); requestAnimationFrame(frame);
</script>
</body>
</html>
