<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Battle History Review</title>
<style>
  :root { color-scheme:dark; }
  html, body { margin:0; height:100%; background:#0b0f16; color:#cde; font:600 13px/1.3 system-ui, sans-serif; overflow:hidden; }
  #menu { position:absolute; inset:0; background:radial-gradient(60% 60% at 30% 50%, #24402a, #0b0f16 70%); }
  .bar { position:fixed; left:6px; bottom:6px; z-index:999; display:flex; gap:4px; flex-wrap:wrap; opacity:.4; }
  .bar:hover, .bar:focus-within { opacity:1; }
  .bar button { padding:6px 9px; background:#111a; color:#cde; border:1px solid #456; cursor:pointer; font:inherit; }
</style>
</head>
<body>
<div id="menu"></div>
<div class="bar" role="toolbar" aria-label="Sample">
  <button data-k="ground">Verdance (12 battles)</button><button data-k="air">Florael (3)</button><button data-k="water">Rime (none)</button>
</div>
<script type="module">
// Review page for the planet battle-history modal [MM-story_mw1azvh8_d]: the game's own module with a sample save.
import { openBattleHistory } from '../../src/menu/battleHistory.js';
import { PLANETS } from '../../src/data/planets.js';
const now = Date.now(), H = 3600e3;
const z = (c = 0, u = 0, r = 0, e = 0) => ({ common: c, uncommon: u, rare: r, epic: e });
const B = (planet, h, mapId, mapName, result, stars, score, kills, sec, gold, xp, harv, kept, favour = null) =>
  ({ at: now - h * H, planet, faction: '', mapId, mapName, result, score, kills, seconds: sec, waves: stars.length, totalWaves: 8, stars,
     avg: Math.round(stars.reduce((a, b) => a + b, 0) / 8 * 10) / 10, gold, xp, harvested: harv, kept, contract: true, favour });
const save = {
  battleLog: [
    B('Verdance', 0.2, 3, 'Seedline Ridge', 'win', [4, 3, 3, 2, 3, 3, 4, 3], 36358, 83, 617, 36358, 258, z(1592, 159, 101), z(0, 0, 91)),
    B('Verdance', 2, 3, 'Seedline Ridge', 'lose', [3, 2, 2, 1, 1], 9120, 44, 402, 0, 70, z(640, 60, 12), z()),
    B('Verdance', 26, 2, 'Hold the Seedline', 'win', [5, 4, 4, 5, 4, 3, 4, 5], 28410, 120, 702, 1840, 210, z(2110, 160, 30, 12), z(0, 0, 0, 2), { title: 'Fair Shares', outcome: 'FULFILLED' }),
    B('Verdance', 30, 2, 'Hold the Seedline', 'win', [3, 3, 2, 3, 3, 2, 3, 3], 18200, 96, 760, 1220, 180, z(1880, 120, 12), z()),
    B('Verdance', 52, 2, 'Hold the Seedline', 'lose', [2, 2, 1], 3100, 20, 210, 0, 40, z(300), z()),
    B('Verdance', 80, 1, 'Landfall', 'win', [5, 5, 5, 4, 5, 5, 4, 5], 22400, 70, 540, 980, 160, z(2020, 140, 8, 30), z(80, 0, 0, 10), { title: 'Rootsong for the Vanguard', outcome: 'BROKEN' }),
    ...Array.from({ length: 6 }, (_, i) => B('Verdance', 100 + i * 20, 1, 'Landfall', i % 3 ? 'win' : 'lose', [3, 3, 2, 3, 2, 3, 3, 2].slice(0, i % 3 ? 8 : 4), 12000 + i * 900, 50 + i, 520, i % 3 ? 700 : 0, 120, z(1500 + i * 40, 90), z())),
    B('Florael', 5, 1, 'First Petals', 'win', [4, 4, 3, 4, 4, 3, 4, 4], 20100, 64, 600, 900, 150, z(1700, 120, 6, 4), z()),
    B('Florael', 9, 1, 'First Petals', 'lose', [2, 1], 2400, 14, 140, 0, 30, z(200), z()),
    B('Florael', 12, 1, 'First Petals', 'lose', [3, 2, 2, 2, 1], 6100, 33, 300, 0, 50, z(480, 20), z()),
  ],
  planetMaps: { Verdance: { 1: { beaten: true, bestAvg: 4.8, runs: 7 }, 2: { beaten: true, bestAvg: 4.3, runs: 3 }, 3: { beaten: true, bestAvg: 3.4, runs: 2 } },
    Florael: { 1: { beaten: true, bestAvg: 3.8, runs: 3 } }, Rime: {} },
};
let cur = null;
function open(k) { if (cur) cur.close(); cur = openBattleHistory(document.getElementById('menu'), PLANETS[k], { save, faction: { ground: 'Ground / Powder', air: 'Air', water: 'Water' }[k] }); }
for (const b of document.querySelectorAll('[data-k]')) b.addEventListener('click', () => open(b.dataset.k));
open(new URLSearchParams(location.search).get('p') || 'ground');
</script>
</body>
</html>
