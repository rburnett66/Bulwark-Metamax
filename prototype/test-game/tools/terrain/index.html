<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terrain Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --gold: #D9A441; --gold2: #f2c869; --cyan: #7af0ff; --ink: #0b0f16; --line: #2a3546; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: #d6e2ee; font: 600 14px/1.3 Rajdhani, system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  .panel { position: fixed; left: 12px; top: 12px; z-index: 10; width: min(340px, calc(100vw - 24px)); background: rgba(11, 15, 22, .86);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; backdrop-filter: blur(6px); box-sizing: border-box; }
  .panel h1 { margin: 0 0 2px; font: 800 15px/1.2 Orbitron, sans-serif; letter-spacing: .06em; color: var(--gold2); }
  .panel p { margin: 0 0 10px; color: #8ea2b8; font-weight: 500; }
  .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .row > span { width: 64px; flex: none; color: #8ea2b8; }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { min-width: 34px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 6px; background: #121a26; color: #cfe0f0;
    font: 700 14px Rajdhani, sans-serif; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold2); color: #1a1206; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  input[type=range] { flex: 1; accent-color: var(--gold); }
  .stats { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-weight: 500; }
  .stats b { color: var(--cyan); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
  .note { margin-top: 8px; color: #8ea2b8; font-weight: 500; font-size: 13px; }
  .hide { position: fixed; right: 12px; top: 12px; z-index: 11; }
  body.min .panel { display: none; }
  @media (max-width: 560px) { .panel { top: auto; bottom: 12px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="seg hide"><button id="hide" aria-pressed="false" title="Hide the panel (H)">Hide panel</button></div>
<section class="panel" aria-label="Terrain review">
  <h1 id="title">Verdance ground</h1>
  <p>Any planet's map with the tiled ground + decals (the default), the previous low-poly ground, or the painted tiles. Drag to pan, wheel or pinch to zoom.</p>
  <div class="row"><span>Planet</span><div class="seg" id="planets"></div></div>
  <div class="row"><span>Map</span><div class="seg" id="maps"></div></div>
  <div class="row"><span>Ground</span><div class="seg" id="modes">
    <button data-m="tiled">Tiled</button><button data-m="lowpoly">Low-poly</button><button data-m="baked">Painted</button></div></div>
  <div class="row"><span>Quality</span><div class="seg" id="tiers">
    <button data-q="high">High</button><button data-q="standard">Standard</button><button data-q="low">Low</button></div></div>
  <div class="row"><span>Zoom</span><input id="zoom" type="range" min="10" max="95" step="1" aria-label="Camera distance"></div>
  <div class="stats" id="stats"></div>
  <div class="note" id="note"></div>
</section>
<script type="module">
// Review page for the tiled terrain [MM-story_mw2qkmb1_2] [MM-story_mw2uk8lq_1]: the game's own 3D renderer on any
// planet's forge map, switching ground mode, quality tier and zoom. Painted tiles exist for map 1 only (the others were
// never baked). The Outpost button [MM-story_mw5oeatc_l] opens the planet's outpost map (<planet key>-outpost.json and
// its baked level), for the planets that have one.
import { createRenderer3D, renderFrame, destroyRenderer } from '../../src/render3d/index.js';
import { buildTerrainMap, resolveResourceTypes } from '../../src/sim/mapgen.js';
import { PLANETS } from '../../src/data/planets.js';
import { fitCameraToRect } from '../../src/render3d/camera.js';
import { mesaFrame } from '../../src/terrain/outpostPads.js';
// forge file slug → the planet key the renderer takes (data/planets.js)
const FACTIONS = [['powder', 'ground'], ['air', 'air'], ['high-tech', 'hightech'], ['artillery', 'artillery'], ['water', 'water'],
  ['arcane-energy', 'arcane'], ['space-tech', 'space'], ['dark-energy', 'dark'], ['greenies', 'greenies']];

const q = new URLSearchParams(location.search);
const OUTPOSTS = new Set(FACTIONS.map(([, k]) => k));   // planet keys with a content/maps/forge/<key>-outpost.json (all nine since O11)
const S = { fac: q.get('faction') || 'powder', map: q.get('map') === 'outpost' ? 'outpost' : +(q.get('map') || 1), mode: q.get('ground') || 'tiled', tier: q.get('quality') || 'high', dist: q.get('dist') ? +q.get('dist') : null };
const stage = document.getElementById('stage');
const maps = document.getElementById('maps');
for (let n = 1; n <= 9; n++) maps.insertAdjacentHTML('beforeend', `<button data-n="${n}">${n}</button>`);
maps.insertAdjacentHTML('beforeend', '<button data-n="outpost">Outpost</button>');
const planets = document.getElementById('planets');
for (const [slug, key] of FACTIONS) planets.insertAdjacentHTML('beforeend', `<button data-f="${slug}">${PLANETS[key].name}</button>`);
const planetKey = () => (FACTIONS.find(([s]) => s === S.fac) || FACTIONS[0])[1];
let r = null, seq = 0, last = performance.now();

function sync() {
  for (const b of maps.children) {
    b.setAttribute('aria-pressed', String(String(b.dataset.n) === String(S.map)));
    if (b.dataset.n === 'outpost') b.disabled = !OUTPOSTS.has(planetKey());
  }
  for (const b of planets.children) b.setAttribute('aria-pressed', String(b.dataset.f === S.fac));
  document.getElementById('title').textContent = PLANETS[planetKey()].name + ' ground';
  for (const b of document.querySelectorAll('#modes button')) {
    b.setAttribute('aria-pressed', String(b.dataset.m === S.mode));
    if (b.dataset.m === 'baked') b.disabled = S.map !== 1;
  }
  for (const b of document.querySelectorAll('#tiers button')) b.setAttribute('aria-pressed', String(b.dataset.q === S.tier));
  const u = new URL(location.href);
  u.searchParams.set('faction', S.fac); u.searchParams.set('map', S.map); u.searchParams.set('ground', S.mode); u.searchParams.set('quality', S.tier);
  history.replaceState(null, '', u);
  document.getElementById('note').textContent = S.mode === 'baked' ? 'Painted: six 2048² tiles, about 3 MB for this map.'
    : S.mode === 'tiled' ? (S.tier === 'low' ? 'Low keeps the flat ground; decals still draw.' : 'Tiled: one 256² texture made in code — nothing to download.')
    : 'Low-poly (previous default): flat colour per triangle' + (S.tier === 'low' ? '.' : ' + grass / sand detail.');
}

async function mount() {
  const my = ++seq;
  if (S.mode === 'baked' && S.map !== 1) S.mode = 'tiled';
  if (S.map === 'outpost' && !OUTPOSTS.has(planetKey())) S.map = 1;
  sync();
  const name = S.map === 'outpost' ? `${planetKey()}-outpost` : `${S.fac}-map-${S.map}`;
  if (r) { destroyRenderer(r); r = null; stage.innerHTML = ''; }
  const forge = await (await fetch(`../../content/maps/forge/${name}.json`)).json();
  const map = buildTerrainMap(forge, S.map === 'outpost' ? 1 : S.map, { seed: 0, bakeTune: {} });
  resolveResourceTypes(map, 1);
  const next = await createRenderer3D(stage, map, { slug: name, baseUrl: '../../', ground: S.mode,
    craft: false, planet: planetKey(), qualityQuery: S.tier });
  if (my !== seq) { destroyRenderer(next); return; }
  r = next;
  window.__r = r;   // for scripted screenshots
  r.fog.update = () => ({ win: null });   // no battle here: open the whole board (clouds only past the map edge)
  if (S.dist) { r.cam.dist = S.dist; r.userMoved = true; }
  else if (S.map === 'outpost') {   // the outpost view frames the mesa, not the 64 × 32 map (tech plan §6.1)
    const f = mesaFrame(forge, 1);
    fitCameraToRect(r.cam, { x0: f.x, z0: f.y, x1: f.x + f.w, z1: f.y + f.h }, innerWidth / innerHeight);
    r.userMoved = true;
  }
  document.getElementById('zoom').value = r.cam.dist;
}

function stats() {
  if (!r || !r.renderer) return;
  const info = r.renderer.info.render, d = r.decals;
  let shown = 0;
  if (d && d.group.visible) {
    const F = new r.THREE.Frustum().setFromProjectionMatrix(new r.THREE.Matrix4().multiplyMatrices(r.camera.projectionMatrix, r.camera.matrixWorldInverse));
    for (const m of d.group.children) if (F.intersectsObject(m)) shown++;
  }
  const rows = [['Draw calls', info.calls], ['Triangles', info.triangles.toLocaleString()],
    ['Ground', r.ground && r.ground.stats && r.ground.stats.splat ? 'tiled shader' : S.mode === 'baked' ? 'painted tiles' : S.tier === 'low' ? 'flat colour' : 'flat colour + grass detail'],
    ['Decals', d ? d.stats.decals : '—'], ['Decal chunks drawn', d ? `${d.group.visible ? shown : 0} of ${d.stats.chunks}` : '—'],
    ['Decal fade', d ? Math.round(d.fade.value * 100) + '%' : '—'], ['Camera distance', r.cam.dist.toFixed(0)]];
  document.getElementById('stats').innerHTML = rows.map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('');
}

function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, (t - last) / 1000); last = t;
  if (!r) return;
  renderFrame(r, null, {}, [], dt);
  if (document.activeElement !== document.getElementById('zoom')) document.getElementById('zoom').value = r.cam.dist;
  if ((t | 0) % 4 === 0) stats();
}
setInterval(stats, 300);

planets.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { S.fac = b.dataset.f; S.dist = r && r.cam.dist; mount(); } });
maps.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !b.disabled) { S.map = b.dataset.n === 'outpost' ? 'outpost' : +b.dataset.n; S.dist = r && r.cam.dist; mount(); } });
document.getElementById('modes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b && !b.disabled) { S.mode = b.dataset.m; S.dist = r && r.cam.dist; mount(); } });
document.getElementById('tiers').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { S.tier = b.dataset.q; S.dist = r && r.cam.dist; mount(); } });
document.getElementById('zoom').addEventListener('input', (e) => { if (r) { r.cam.dist = +e.target.value; r.userMoved = true; } });
const hide = () => { document.body.classList.toggle('min'); document.getElementById('hide').setAttribute('aria-pressed', String(document.body.classList.contains('min'))); };
document.getElementById('hide').addEventListener('click', hide);
addEventListener('keydown', (e) => { if (e.key === 'h' || e.key === 'H') hide(); });
mount();
requestAnimationFrame(frame);
</script>
</body>
</html>
