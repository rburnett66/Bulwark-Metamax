<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Review Frames</title>
<!-- [MM-story_mwabh8h1_l] The FARM tab in device frames, for review outside Claude: one preset at a time, as a phone
     held sideways (844 × 390, Bulwark is landscape-first) and as a desktop window (1400 × 860), side by side. Each frame is
     ./farm.html on the same preset (the real outpost view on its FARM tab, an in-memory save). Two 3D views at a time.
     Query: ?state=new|growing|harvest|full|dead|trampled|away · ?quality=low|standard|high · ?speed=60 -->
<style>
  :root { --bg:#0b0f14; --panel:#141a22; --line:#2a3442; --ink:#e6ebe3; --dim:#8c98a8; --gold:#d9a441; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:14px 18px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font:800 15px/1 system-ui; letter-spacing:.18em; margin:0 12px 0 0; }
  header button { font:inherit; padding:7px 12px; background:#1b2430; color:var(--ink); border:1px solid var(--line); border-radius:4px; cursor:pointer; }
  header button[aria-pressed="true"] { background:var(--gold); border-color:var(--gold); color:#1a1206; font-weight:700; }
  header select { font:inherit; padding:6px; background:#1b2430; color:var(--ink); border:1px solid var(--line); border-radius:4px; }
  header .note { color:var(--dim); font-size:12px; margin-left:auto; }
  main { display:flex; flex-wrap:wrap; gap:28px; padding:22px 18px 40px; align-items:flex-start; }
  figure { margin:0; }
  figcaption { color:var(--dim); font-size:12px; margin-top:8px; letter-spacing:.06em; }
  .phone { padding:14px 26px; background:#05070a; border-radius:34px; border:2px solid #2b3240; box-shadow:0 18px 50px rgba(0,0,0,.55); position:relative; }
  .phone::before { content:''; position:absolute; left:10px; top:50%; width:5px; height:44px; margin-top:-22px; border-radius:3px; background:#1c222c; }
  .desk { padding:26px 10px 10px; background:#05070a; border-radius:10px; border:2px solid #2b3240; position:relative; box-shadow:0 18px 50px rgba(0,0,0,.55); }
  .desk::before { content:'● ● ●'; position:absolute; left:12px; top:6px; color:#3a4452; font-size:10px; letter-spacing:2px; }
  .screen { overflow:hidden; border-radius:10px; background:#0f1412; position:relative; }
  .screen iframe { border:0; display:block; transform-origin:0 0; }
</style>
</head>
<body>
<header>
  <h1>FARM · REVIEW FRAMES</h1>
  <div id="presets" role="tablist"></div>
  <label>Quality <select id="quality"><option value="low">low</option><option value="standard" selected>standard</option><option value="high">high</option></select></label>
  <label>Clock <select id="speed"><option value="1">real time</option><option value="60">1 min / s</option><option value="600">10 min / s</option></select></label>
  <span class="note">Each frame is <a href="./farm.html" style="color:#4fb8ff">farm.html</a>: the real FARM tab on a seeded, in-memory save.</span>
</header>
<main>
  <figure><div class="phone"><div class="screen" id="phoneScreen"></div></div><figcaption>PHONE, LANDSCAPE · 844 × 390</figcaption></figure>
  <figure><div class="desk"><div class="screen" id="deskScreen"></div></div><figcaption>DESKTOP · 1400 × 860 (shown at 60%)</figcaption></figure>
</main>
<script>
const PRESETS = [['new', 'F1 just accepted'], ['growing', 'Growing'], ['harvest', 'Harvest time'], ['full', 'Silo full'], ['dead', 'Missed: dead'], ['trampled', 'After a raid'], ['away', 'Back after 6 h']];
const q = new URLSearchParams(location.search);
let state = PRESETS.some(([k]) => k === q.get('state')) ? q.get('state') : 'growing';
if (q.get('quality')) document.getElementById('quality').value = q.get('quality');
if (q.get('speed')) document.getElementById('speed').value = q.get('speed');
const bar = document.getElementById('presets');
for (const [k, label] of PRESETS) {
  const b = document.createElement('button'); b.textContent = label; b.dataset.k = k;
  b.onclick = () => { state = k; render(); };
  bar.appendChild(b);
}
function frame(host, w, h, scale) {
  host.innerHTML = '';
  host.style.width = Math.round(w * scale) + 'px'; host.style.height = Math.round(h * scale) + 'px';
  const f = document.createElement('iframe');
  f.width = w; f.height = h; f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = `scale(${scale})`;
  f.title = `FARM tab, ${state}, ${w} × ${h}`;
  f.src = `./farm.html?ui=0&state=${state}&quality=${document.getElementById('quality').value}&speed=${document.getElementById('speed').value}`;
  host.appendChild(f);
}
function render() {
  for (const b of bar.children) b.setAttribute('aria-pressed', String(b.dataset.k === state));
  const u = new URL(location.href); u.searchParams.set('state', state); history.replaceState(null, '', u);
  frame(document.getElementById('phoneScreen'), 844, 390, 1);
  frame(document.getElementById('deskScreen'), 1400, 860, 0.6);
}
document.getElementById('quality').onchange = render;
document.getElementById('speed').onchange = render;
render();
</script>
</body>
</html>
