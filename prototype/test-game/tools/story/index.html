<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Story Map</title>
<!-- Story Map [MM-epic_mwtlwawp_f]: the whole story on one timeline, built from the live content files. -->
<style>
  :root {
    color-scheme: dark;
    --bg: #070a10; --panel: #0d131c; --panel2: #121a26; --line: #22324a; --ink: #e6ecf3; --dim: #8ea3b8; --gold: #f2c869;
    --toolhead: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #app { position: absolute; inset: var(--toolhead) 0 0 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  #stage { position: relative; min-width: 0; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #cv.drag { cursor: grabbing; }
  #cv.hot { cursor: pointer; }

  /* the command bar floats over the graph */
  .hud { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; gap: 8px; align-items: center; pointer-events: none; z-index: 3; }
  .hud > * { pointer-events: auto; }
  .brand { display: flex; flex-direction: column; padding: 6px 12px; border-radius: 10px; background: linear-gradient(160deg, #141d2bdd, #0b111add);
    border: 1px solid #2a3c56; backdrop-filter: blur(8px); white-space: nowrap; }
  .brand b { font: 800 13px/1.1 "Segoe UI", system-ui; letter-spacing: .22em; color: var(--gold); }
  .brand span { font-size: 10.5px; color: var(--dim); letter-spacing: .06em; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; min-width: 0; flex: 1; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { --c: #fff; display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 9px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    background: #0e1520cc; border: 1px solid #2a3a52; color: #cfd9e4; font: 600 11.5px/1 "Segoe UI", system-ui; letter-spacing: .03em;
    backdrop-filter: blur(8px); transition: background .18s, border-color .18s, box-shadow .18s, color .18s; user-select: none; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .chip em { font-style: normal; color: var(--dim); font-weight: 500; font-size: 10.5px; }
  .chip:hover { border-color: var(--c); }
  .chip.on { background: color-mix(in srgb, var(--c) 22%, #0e1520); border-color: var(--c); color: #fff; box-shadow: 0 0 0 1px var(--c) inset, 0 0 18px -4px var(--c); }
  .chip.on em { color: #fff; }
  .tools { display: flex; gap: 6px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid #2a3a52; border-radius: 8px; overflow: hidden; background: #0e1520cc; backdrop-filter: blur(8px); }
  .seg button { background: none; border: 0; color: #b6c4d3; padding: 6px 10px; font: 600 11px/1 "Segoe UI", system-ui; cursor: pointer; letter-spacing: .04em; }
  .seg button.on { background: #203048; color: #fff; }
  .search { background: #0e1520cc; border: 1px solid #2a3a52; color: var(--ink); border-radius: 8px; padding: 6px 10px; width: 170px; font: inherit; font-size: 12px; outline: none; backdrop-filter: blur(8px); }
  .search:focus { border-color: var(--gold); }
  .iconbtn { background: #0e1520cc; border: 1px solid #2a3a52; color: #cfd9e4; border-radius: 8px; padding: 6px 9px; cursor: pointer; font: 600 11px/1 "Segoe UI", system-ui; backdrop-filter: blur(8px); }
  .iconbtn:hover { border-color: var(--gold); color: #fff; }

  /* the playhead readout */
  #readout { position: absolute; left: 12px; bottom: 104px; z-index: 3; pointer-events: none; padding: 7px 11px; border-radius: 8px;
    background: #0b111add; border: 1px solid #23344c; font-size: 11.5px; color: #c9d6e3; backdrop-filter: blur(6px); min-width: 210px; }
  #readout b { color: #fff; font-weight: 700; }
  #readout .row { display: flex; gap: 10px; margin-top: 3px; color: var(--dim); font-size: 10.5px; }
  #readout .row span i { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }

  #tip { position: absolute; z-index: 5; pointer-events: none; max-width: 300px; padding: 9px 11px; border-radius: 10px;
    background: linear-gradient(160deg, #162132f2, #0c121bf2); border: 1px solid #34496a; box-shadow: 0 12px 30px -8px #000c;
    opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; font-size: 12px; }
  #tip.show { opacity: 1; transform: none; }
  #tip .k { font: 700 9.5px/1 "Segoe UI", system-ui; letter-spacing: .16em; color: var(--dim); text-transform: uppercase; }
  #tip .t { font-weight: 700; color: #fff; margin: 4px 0 3px; font-size: 13px; }
  #tip .w { color: #a9bccf; font-size: 11px; }
  #tip .th { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  #tip .th span { font-size: 9.5px; padding: 2px 6px; border-radius: 999px; border: 1px solid; }

  /* the detail panel */
  #panel { width: 0; overflow: hidden; background: linear-gradient(180deg, #0f1622, #0a0f17); border-left: 1px solid #1f2d42; transition: width .28s cubic-bezier(.2,.8,.2,1); position: relative; z-index: 4; }
  #panel.open { width: min(420px, 42vw); }
  #panel .inner { width: min(420px, 42vw); height: 100%; display: flex; flex-direction: column; }
  .ph { padding: 16px 16px 12px; border-bottom: 1px solid #1c2a3d; position: relative; background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--pc, #4da6ff) 20%, transparent), transparent 70%); }
  .ph .close { position: absolute; right: 10px; top: 10px; background: none; border: 1px solid #2a3a52; color: #9fb1c4; width: 28px; height: 28px; border-radius: 7px; cursor: pointer; font-size: 14px; }
  .ph .close:hover { color: #fff; border-color: var(--gold); }
  .ph .top { display: flex; gap: 12px; align-items: center; padding-right: 30px; }
  .ph .pt { width: 62px; height: 62px; border-radius: 12px; object-fit: cover; border: 1px solid #34496a; background: #0b111a; flex: none; box-shadow: 0 6px 18px -6px #000; }
  .ph .kind { font: 700 9.5px/1 "Segoe UI", system-ui; letter-spacing: .18em; color: var(--pc, var(--dim)); text-transform: uppercase; }
  .ph h2 { margin: 5px 0 3px; font-size: 17px; line-height: 1.2; color: #fff; }
  .ph .sub { color: var(--dim); font-size: 11.5px; }
  .ph .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
  .ph .tags span { font-size: 10px; padding: 3px 8px; border-radius: 999px; border: 1px solid; letter-spacing: .03em; }
  .avail { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: #0b111a; border: 1px solid #1f2e44; font-size: 11.5px; color: #c4d2e0; }
  .avail .bar { position: relative; height: 6px; margin: 7px 0 3px; border-radius: 3px; background: #172334; overflow: hidden; }
  .avail .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .avail .bar i.tail { opacity: .35; }
  .avail .scale { display: flex; justify-content: space-between; font-size: 9.5px; color: #6f8399; }
  .tabs { display: flex; border-bottom: 1px solid #1c2a3d; padding: 0 10px; }
  .tabs button { flex: 1; background: none; border: 0; color: #8ea3b8; padding: 11px 0 10px; font: 700 11px/1 "Segoe UI", system-ui; letter-spacing: .14em; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button.on { color: #fff; border-bottom-color: var(--gold); }
  .tabs button em { font-style: normal; color: #6f8399; font-weight: 600; margin-left: 4px; }
  .body { flex: 1; overflow-y: auto; padding: 14px 16px 30px; }
  .body h4 { margin: 16px 0 7px; font: 700 10px/1 "Segoe UI", system-ui; letter-spacing: .16em; color: #7f93a9; text-transform: uppercase; }
  .body h4:first-child { margin-top: 2px; }
  .brief { font-size: 13px; color: #dde6ef; line-height: 1.55; }
  .kv { display: grid; grid-template-columns: 112px 1fr; gap: 5px 10px; font-size: 12px; }
  .kv dt { color: #7f93a9; }
  .kv dd { margin: 0; color: #dfe7ef; }
  .rw { display: flex; flex-wrap: wrap; gap: 6px; }
  .rw span { padding: 5px 9px; border-radius: 7px; background: #121c2a; border: 1px solid #243650; font-size: 11.5px; }
  .rw span b { color: var(--gold); margin-right: 4px; }
  .people { display: flex; flex-direction: column; gap: 6px; }
  .person { display: flex; gap: 9px; align-items: center; padding: 6px; border-radius: 9px; background: #101926; border: 1px solid #1f2e44; }
  .person img { width: 34px; height: 34px; border-radius: 8px; object-fit: cover; background: #0b111a; }
  .person .n { font-weight: 600; font-size: 12px; }
  .person .r { font-size: 10.5px; color: #8ea3b8; }
  .line { display: flex; gap: 10px; margin-bottom: 12px; }
  .line img { width: 36px; height: 36px; border-radius: 9px; object-fit: cover; background: #0b111a; flex: none; border: 1px solid #2a3c56; }
  .line .bub { flex: 1; padding: 8px 11px; border-radius: 4px 12px 12px 12px; background: #131d2b; border: 1px solid #23344c; }
  .line .who { font-weight: 700; font-size: 11.5px; color: #fff; }
  .line .when { font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: #7f93a9; margin-left: 6px; font-weight: 600; }
  .line .say { margin-top: 3px; font-size: 12.5px; color: #dde6ef; line-height: 1.5; }
  .line.brief .bub { background: #0f1724; border-style: dashed; }
  .crit { margin-bottom: 12px; }
  .crit ul { list-style: none; margin: 0; padding: 0; }
  .crit li { display: flex; gap: 9px; align-items: flex-start; padding: 7px 9px; border-radius: 8px; background: #101926; border: 1px solid #1d2b40; margin-bottom: 5px; font-size: 12px; }
  .crit li i { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; background: var(--cc, #4da6ff); box-shadow: 0 0 8px var(--cc, #4da6ff); }
  .crit li code { display: block; font: 10.5px/1.3 ui-monospace, Consolas, monospace; color: #6f8399; margin-top: 2px; }
  .crit li.bonus { border-style: dashed; }
  .steps { display: flex; flex-direction: column; gap: 5px; }
  .steps button { display: flex; gap: 10px; align-items: center; text-align: left; background: #101926; border: 1px solid #1f2e44; color: var(--ink); border-radius: 8px; padding: 8px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .steps button:hover { border-color: var(--gold); }
  .steps button i { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 10.5px; color: #0b0f16; flex: none; }
  .steps button span { color: #8ea3b8; font-size: 10.5px; margin-left: auto; white-space: nowrap; }
  .empty { color: #7f93a9; font-size: 12px; padding: 10px 0; }
  .note { margin-top: 14px; font-size: 10.5px; color: #6f8399; border-top: 1px solid #1c2a3d; padding-top: 10px; }

  #loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 9; background: var(--bg); transition: opacity .5s; }
  #loading.gone { opacity: 0; pointer-events: none; }
  #loading div { font: 700 12px/1 "Segoe UI", system-ui; letter-spacing: .3em; color: var(--gold); }

  @media (max-width: 900px) {
    #app { grid-template-columns: minmax(0, 1fr); }
    #panel { position: absolute; right: 0; top: 0; bottom: 0; box-shadow: -20px 0 40px -10px #000c; }
    #panel.open, #panel .inner { width: min(380px, 88vw); }
    .search { width: 110px; }
    .brand span { display: none; }
    #readout { bottom: 84px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Story timeline"></canvas>
    <div class="hud">
      <div class="brand"><b>STORY MAP</b><span id="stats">loading…</span></div>
      <div class="chips" id="chips" role="toolbar" aria-label="Themes"></div>
      <div class="tools">
        <div class="seg" id="path" role="group" aria-label="Alignment path">
          <button data-v="both" class="on">Both</button><button data-v="light">Light</button><button data-v="shadow">Shadow</button>
        </div>
        <input class="search" id="q" type="search" placeholder="Search missions, people…" aria-label="Search">
        <button class="iconbtn" id="fit" title="Fit the whole story (F)">⤢ Fit</button>
      </div>
    </div>
    <div id="readout"></div>
    <div id="tip"></div>
    <div id="loading"><div>LOADING THE STORY</div></div>
  </div>
  <aside id="panel" aria-label="Details"><div class="inner" id="pinner"></div></aside>
</div>
<script src="../toolhead.js"></script>
<script>
  try {
    ToolHead.mount({ tool: 'story' });
    const bar = document.querySelector('.th-bar');
    if (bar) document.documentElement.style.setProperty('--toolhead', bar.getBoundingClientRect().height + 'px');
  } catch (e) { /* the page works without the header */ }
</script>
<script type="module" src="./storyMap.js"></script>
</body>
</html>
