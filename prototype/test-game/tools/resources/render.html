<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resource Model Renders</title>
<style>
  html, body { margin:0; background:#0b0f16; color:#dfe7ef; font:600 14px/1.3 system-ui, sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:12px; padding:16px; }
  figure { margin:0; background:#0d121a; border:1px solid #263142; }
  figure img { display:block; width:100%; aspect-ratio:1; }
  figcaption { padding:6px 8px; display:flex; justify-content:space-between; }
  figcaption span { color:#8A97A8; font-weight:500; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script type="module">
// Reference renders of the current 3D resource models [MM-story_mw17sqtd_4]: each planet × tier model from
// render3d/resources/models.js, lit exactly as the menu's resource plinth (menuStage.js), from the menu's camera
// angle. ?size=1024 sets the image size, ?bg=0 renders on a transparent background, ?plinth=0 hides the plinth.
// window.__renders → [{ key, planet, tier, name, png }] for tools that save the files.
import * as THREE from '../../vendor/three.module.js';
import { resourceModel } from '../../src/render3d/resources/models.js';
import { mergeResourceModel } from '../../src/render3d/resources/resources3d.js';
import { PLANETS } from '../../src/data/planets.js';

const q = new URLSearchParams(location.search);
const S = Number(q.get('size')) || 1024, BG = q.get('bg') !== '0', PLINTH = q.get('plinth') !== '0';
const TIERS = ['common', 'uncommon', 'rare', 'epic'];
const canvas = document.createElement('canvas'); canvas.width = canvas.height = S;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(S, S, false);
if (THREE.sRGBEncoding) renderer.outputEncoding = THREE.LinearEncoding;   // as the menu stage
renderer.setClearColor(0x0d121a, BG ? 1 : 0);
const litMat = new THREE.MeshLambertMaterial({ vertexColors: true }), glowMat = new THREE.MeshBasicMaterial({ vertexColors: true });
const plinthGeo = new THREE.CylinderGeometry(0.62, 0.7, 0.08, 28), plinthMat = new THREE.MeshLambertMaterial({ color: 0x1c222b });
const cam = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
const out = [];
for (const [key, p] of Object.entries(PLANETS)) for (const tier of TIERS) {
  const scene = new THREE.Scene();
  const hemi = new THREE.HemisphereLight(0xdfe8ff, 0x3a3f48, 0.75), amb = new THREE.AmbientLight(0xffffff, 0.2);
  const sun = new THREE.DirectionalLight(0xfff2e0, 1.15); sun.position.set(-3, 6, 4);
  const rim = new THREE.DirectionalLight(0x9fc8ff, 0.55); rim.position.set(4, 3, 6);
  scene.add(hemi, amb, sun, rim);
  if (PLINTH) { const pl = new THREE.Mesh(plinthGeo, plinthMat); pl.position.y = -0.04; scene.add(pl); }
  const turn = new THREE.Group(); turn.rotation.y = -0.6; scene.add(turn);
  const m = mergeResourceModel(THREE, resourceModel(key, tier));
  for (const [geo, mat] of [[m.lit, litMat], [m.glow, glowMat]]) if (geo) turn.add(new THREE.Mesh(geo, mat));
  // frame the model: the menu's angle (camera up and in front, looking slightly down), distance fitted to its size
  const box = new THREE.Box3().setFromObject(turn), c = box.getCenter(new THREE.Vector3()), r = box.getSize(new THREE.Vector3()).length() / 2;
  const d = r / Math.sin(15 * Math.PI / 180) * 0.92;
  const dir = new THREE.Vector3(0, 1.0 - 0.28, 2.35).normalize();
  cam.position.copy(c).addScaledVector(dir, d); cam.lookAt(c);
  renderer.render(scene, cam);
  const png = canvas.toDataURL('image/png');
  const name = p.resources[tier].name;
  out.push({ key: `${key}.${tier}`, planet: p.name, tier, name, png });
  const f = document.createElement('figure');
  f.innerHTML = `<img alt="${name}" src="${png}"><figcaption>${name}<span>${p.name} · ${tier}</span></figcaption>`;
  document.getElementById('g').appendChild(f);
  for (const o of turn.children) o.geometry.dispose();
}
window.__renders = out;
document.title = 'Resource Model Renders (' + out.length + ')';
</script>
</body>
</html>
