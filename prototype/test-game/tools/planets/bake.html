<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planet Bake</title>
<!--
  tools/planets/bake.html — renders each faction's homeworld (src/data/planets.js) to a transparent PNG for the
  FACTIONS screen [MM-story_mva7wn9l_t]. Same globe shaders and seeds as the "Bulwark Planets" design page.

  Use: serve prototype/test-game, open tools/planets/bake.html, click a planet to download it, and save it as
  content/planets/<key>.png. Headless: window.bakeAll(size) → { key: dataURL }.
-->
<style>
  :root { --bg: #0b0e13; --fg: #e6ecf3; --muted: #8fa0b3; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px system-ui, sans-serif; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  figure { margin: 0; text-align: center; cursor: pointer; }
  figure img { width: 160px; height: 160px; display: block; }
  figcaption { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
</style>
</head>
<body>
<p>Click a planet to download its PNG; save it as <code>content/planets/&lt;key&gt;.png</code>.</p>
<div class="row" id="row"></div>
<script type="module">
import * as THREE from '../../vendor/three.module.js';
import { PLANETS } from '../../src/data/planets.js';
import { makeGlobe, GLOBE_KEYS } from '../../src/render3d/planet/globe.js';

const KEYS = GLOBE_KEYS;   // faction order — the seed index, same as the design page

const canvas = document.createElement('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0);
const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 20); camera.position.set(0, 0, 6.0);
const geo = new THREE.SphereGeometry(1, 128, 96);
// the shaders live in src/render3d/planet/globe.js, shared with the menu's live globes [MM-story_mvcnxgt8_13]
function makeWorld(key) { const scene = new THREE.Scene(); scene.add(makeGlobe(THREE, key, { geo }).root); return scene; }

function bake(key, size) {
  renderer.setPixelRatio(1); renderer.setSize(size, size, false);
  renderer.render(makeWorld(key), camera);
  return canvas.toDataURL('image/png');
}
window.bakeAll = (size = 256) => Object.fromEntries(KEYS.map((k) => [k, bake(k, size)]));

const row = document.getElementById('row');
for (const [k, url] of Object.entries(window.bakeAll())) {
  const f = document.createElement('figure');
  f.innerHTML = `<img alt="${PLANETS[k].name}" src="${url}"><figcaption>${PLANETS[k].name} · ${k}</figcaption>`;
  f.addEventListener('click', () => { const a = document.createElement('a'); a.href = url; a.download = `${k}.png`; a.click(); });
  row.appendChild(f);
}
window.bakeReady = true;
</script>
</body>
</html>
