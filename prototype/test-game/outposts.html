<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outpost Models</title>
<!-- Review page for the outpost building models (MM-story_mw5oect7_m). Loads content/outposts/outposts.json and the
     GLBs the game will load, with the game's three.js (vendored r128). Turn a building, play its working clips,
     switch to the Mk II look (amber, 2× tempo), recolour the faction trim, step the LODs and show the cell grid. -->
<style>
  :root {
    --bg: #2a2d33; --panel: #17191d; --line: #30343b; --text: #e6e8eb; --dim: #8e949d;
    --accent: #ff7a1a; --cyan: #3fa9ff; --amber: #ffad3b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; grid-template-columns: 260px 1fr; height: 100dvh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .list button { display: block; width: 100%; text-align: left; margin: 0 0 4px; padding: 8px 10px;
    background: transparent; color: var(--text); border: 1px solid transparent; border-radius: 6px; cursor: pointer; font: inherit; }
  .list button:hover { border-color: var(--line); }
  .list button[aria-pressed="true"] { border-color: var(--accent); background: #22252b; }
  .list small { display: block; color: var(--dim); font-size: 12px; }
  .group { margin: 14px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  .group > div { margin: 0 0 6px; color: var(--dim); font-size: 12px; }
  label.tog { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  .seg { display: flex; gap: 4px; }
  .seg button { flex: 1; padding: 6px 0; background: #22252b; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; cursor: pointer; font: inherit; }
  .seg button[aria-pressed="true"] { border-color: var(--accent); }
  .swatches { display: flex; gap: 6px; }
  .swatches button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatches button[aria-pressed="true"] { border-color: var(--text); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 3px 0; vertical-align: top; } td:first-child { color: var(--dim); width: 74px; }
  main { position: relative; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #status { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  @media (max-width: 720px) {
    body { grid-template-columns: 1fr; grid-template-rows: 55dvh 1fr; }
    main { grid-row: 1; } aside { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
    .list { display: flex; gap: 4px; overflow-x: auto; }
    .list button { flex: 0 0 auto; width: auto; }
    .list small { display: none; }
  }
</style>
</head>
<body>
<aside>
  <h1>Outpost models</h1>
  <div class="list" id="list"></div>
  <div class="group">
    <label class="tog"><input type="checkbox" id="working" checked> Working (play clips)</label>
    <label class="tog"><input type="checkbox" id="mk2"> Mk II look (amber, 2× tempo)</label>
    <label class="tog"><input type="checkbox" id="spin" checked> Turntable</label>
    <label class="tog"><input type="checkbox" id="grid"> Cell grid (1 cell squares)</label>
    <label class="tog"><input type="checkbox" id="anchors"> Anchors</label>
    <label class="tog"><input type="checkbox" id="closed"> Unpowered (storage door shut)</label>
  </div>
  <div class="group"><div>Level of detail</div>
    <div class="seg" id="lods"><button data-lod="0" aria-pressed="true">LOD0</button><button data-lod="1">LOD1</button><button data-lod="2">LOD2</button></div>
  </div>
  <div class="group"><div>Faction trim</div><div class="swatches" id="trim"></div></div>
  <div class="group"><table id="stats"></table></div>
</aside>
<main><canvas id="view"></canvas><div id="status">Loading…</div></main>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/three-addons/loaders/GLTFLoader.js';
import { OrbitControls } from './vendor/three-addons/controls/OrbitControls.js';
import { EffectComposer } from './vendor/three-addons/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/three-addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/three-addons/postprocessing/UnrealBloomPass.js';

const BASE = './content/outposts/';
const CYAN = new THREE.Color(0.05, 0.42, 1.0), AMBER = new THREE.Color(1.0, 0.45, 0.08);
const TRIMS = { Orange: 0xeb5c0d, Crimson: 0xc8232c, Jade: 0x1f9e6a, Violet: 0x7a3fd1, Steel: 0x6f8aa3 };

const canvas = document.getElementById('view'), statusEl = document.getElementById('status');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.shadowMap.enabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a3e45);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight(0xdfe7f2, 0x4a3a32, 0.4));
const sun = new THREE.DirectionalLight(0xfff2e0, 1.0);
sun.position.set(-6, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(9, 48), new THREE.MeshStandardMaterial({ color: 0x3b2a24, roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(8, 8, 0xffb070, 0x9a8a80);
grid.position.y = 0.004;
grid.visible = false;
scene.add(grid);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.6, 0.35, 0.92);
composer.addPass(bloom);

const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false });
const loader = new GLTFLoader();
const cache = new Map();
let manifest = {}, slug = null, lod = 0, current = null, mixer = null, trimColor = TRIMS.Orange;

function prepare(root) {
  // the game's material contract: ship_glow → unlit vertex colour; outpost_trim → the faction colour
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = o.receiveShadow = true;
    const name = o.material.name;
    if (name === 'ship_glow') {
      o.material = glowMat;
      o.castShadow = false;
      const col = o.geometry.getAttribute('color');
      o.userData.baseColors = col.array.slice();
    } else if (name === 'outpost_trim') {
      o.material = o.material.clone();
      o.material.vertexColors = false;
      o.userData.trim = true;
    }
  });
  return root;
}

function applyLook() {
  if (!current) return;
  const mk2 = document.getElementById('mk2').checked;
  current.scene.traverse((o) => {
    if (!o.isMesh) return;
    if (o.userData.trim) {
      o.material.color.set(mk2 ? 0xff8a1e : trimColor);
      o.material.emissive.set(mk2 ? 0xff7a10 : 0x000000);
      o.material.emissiveIntensity = mk2 ? 0.35 : 0;
    }
    if (o.userData.baseColors) {
      // Mk II: the cyan lights turn hot amber; ore, brine and beam colours keep theirs
      const col = o.geometry.getAttribute('color'), src = o.userData.baseColors, n = col.itemSize;
      for (let i = 0; i < col.count; i++) {
        const r = src[i * n], g = src[i * n + 1], b = src[i * n + 2];
        const cyan = Math.abs(r - CYAN.r) + Math.abs(g - CYAN.g) + Math.abs(b - CYAN.b) < 0.15;
        const c = mk2 && cyan ? AMBER : { r, g, b };
        col.array[i * n] = c.r; col.array[i * n + 1] = c.g; col.array[i * n + 2] = c.b;
      }
      col.needsUpdate = true;
    }
  });
  if (mixer) mixer.timeScale = mk2 ? 2 : 1;
}

function setWorking() {
  if (!mixer) return;
  const on = document.getElementById('working').checked;
  mixer.stopAllAction();
  if (on) for (const c of current.animations) mixer.clipAction(c).play();
  else mixer.update(0);
}

// The storage door (O10): node `door` rests closed; powered, the view (outpostScene.js setDoor) squashes it to 8 % of
// its height and lifts it 0.6 into the header. The same here, so the open and the unpowered look can be reviewed.
function applyPose() {
  if (!current) return;
  const closed = document.getElementById('closed').checked;
  current.scene.traverse((o) => {
    if (!o.userData || o.userData.node !== 'door' || !o.userData.pivot) return;
    if (!o.userData.doorRest) o.userData.doorRest = { y: o.position.y, sy: o.scale.y };
    const r0 = o.userData.doorRest;
    o.scale.y = closed ? r0.sy : r0.sy * 0.08;
    o.position.y = closed ? r0.y : r0.y + 0.6;
  });
}

function anchorsOn(root) {
  const show = document.getElementById('anchors').checked;
  root.traverse((o) => {
    if (!o.name.startsWith('anchor_')) return;
    if (!o.userData.marker) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff2bd6, depthTest: false }));
      m.renderOrder = 10;
      o.add(m);
      o.userData.marker = m;
    }
    o.userData.marker.visible = show;
  });
}

async function show(nextSlug, nextLod = lod) {
  slug = nextSlug; lod = nextLod;
  const file = manifest[slug].lods[lod].file;
  statusEl.textContent = `Loading ${file}…`;
  if (!cache.has(file)) cache.set(file, new Promise((ok, fail) => loader.load(BASE + file, (g) => ok(prepare(g.scene) && g), undefined, fail)));
  const gltf = await cache.get(file);
  if (current) scene.remove(current.scene);
  current = gltf;
  scene.add(gltf.scene);
  mixer = gltf.animations.length ? new THREE.AnimationMixer(gltf.scene) : null;
  gltf.scene.userData.debris = [];
  gltf.scene.traverse((o) => { if (o.name.startsWith('anchor_debris')) gltf.scene.userData.debris.push(o); });
  parts.length = 0;
  setWorking(); applyLook(); applyPose(); anchorsOn(gltf.scene);
  const m = manifest[slug], l = m.lods[lod];
  const clips = Object.entries(m.clips).map(([k, v]) => `${k} (${v}s)`).join(', ') || 'none';
  document.getElementById('stats').innerHTML = `
    <tr><td>Model</td><td>${m.label}</td></tr>
    <tr><td>Footprint</td><td>${m.footprint[0]} × ${m.footprint[1]} cells, ${m.height} high</td></tr>
    <tr><td>${'LOD' + lod}</td><td>${l.tris.toLocaleString()} tris, ${l.drawCalls} draw calls, ${(l.bytes / 1024).toFixed(0)} KB</td></tr>
    <tr><td>Clips</td><td>${clips}</td></tr>
    <tr><td>Nodes</td><td>${m.nodes.join(', ') || 'none'}</td></tr>
    <tr><td>Anchors</td><td>${Object.keys(m.anchors).join(', ') || 'none'}</td></tr>`;
  for (const b of document.querySelectorAll('#list button')) b.setAttribute('aria-pressed', String(b.dataset.slug === slug));
  for (const b of document.querySelectorAll('#lods button')) b.setAttribute('aria-pressed', String(+b.dataset.lod === lod));
  statusEl.textContent = `${file}`;
}

function frame() {
  const box = new THREE.Box3().setFromObject(current.scene), size = box.getSize(new THREE.Vector3());
  const r = Math.max(size.x, size.z, size.y) * 2.1;
  controls.target.set(0, size.y * 0.35, 0);
  camera.position.set(0, r * 0.75, r * 1.05);  // the concept angle: from the front, looking down
  controls.update();
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);

// Debris preview: what the game's particle code does at each rig's debris_* anchor while it works (design §8.4):
// rock chips, cut fragments or brine splash, at 3× the rate and with larger chunks on Mk II.
const DEBRIS = { rock: [0x4a4440, 0x5c534c, 0x2f6fd0], ore: [0x2a7ae0, 0x9ad0ff, 0x4a4440], brine: [0x7fe0d8, 0xc8fff8, 0xffffff] };
const MAXP = 600, parts = [], dummy = new THREE.Object3D(), tmp = new THREE.Vector3(), col = new THREE.Color();
const debrisMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ roughness: 0.9 }), MAXP);
debrisMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
debrisMesh.count = 0;
debrisMesh.castShadow = true;
scene.add(debrisMesh);
let debrisCarry = 0;
function stepDebris(dt) {
  const working = document.getElementById('working').checked, mk2 = document.getElementById('mk2').checked;
  const sources = working && current ? current.scene.userData.debris || [] : [];
  debrisCarry += dt * (mk2 ? 45 : 15) * sources.length;
  while (debrisCarry >= 1 && parts.length < MAXP) {
    debrisCarry -= 1;
    const a = sources[Math.floor(Math.random() * sources.length)];
    const pal = DEBRIS[a.userData.color] || DEBRIS.rock;
    a.getWorldPosition(tmp);
    const ang = Math.random() * Math.PI * 2, out = 0.4 + Math.random() * 0.8;
    parts.push({ p: tmp.clone(), v: new THREE.Vector3(Math.cos(ang) * out, 1.2 + Math.random() * 1.2, Math.sin(ang) * out),
      s: (mk2 ? 0.055 : 0.035) * (0.6 + Math.random() * 0.8), life: 0.8 + Math.random() * 0.5, spin: Math.random() * 6,
      c: pal[Math.floor(Math.random() * pal.length)] });
  }
  if (!sources.length) debrisCarry = 0;
  let n = 0;
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life -= dt;
    if (q.life <= 0) { parts.splice(i, 1); continue; }
    q.v.y -= 6 * dt;
    q.p.addScaledVector(q.v, dt);
    if (q.p.y < q.s / 2) { q.p.y = q.s / 2; q.v.y *= -0.3; q.v.x *= 0.6; q.v.z *= 0.6; }
    dummy.position.copy(q.p);
    dummy.rotation.set(q.spin * q.life, q.spin * q.life * 0.7, 0);
    dummy.scale.setScalar(q.s * Math.min(1, q.life * 3));
    dummy.updateMatrix();
    debrisMesh.setMatrixAt(n, dummy.matrix);
    debrisMesh.setColorAt(n, col.set(q.c).convertSRGBToLinear());
    n++;
  }
  debrisMesh.count = n;
  debrisMesh.instanceMatrix.needsUpdate = true;
  if (debrisMesh.instanceColor) debrisMesh.instanceColor.needsUpdate = true;
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  stepDebris(dt);
  if (current && document.getElementById('spin').checked) current.scene.rotation.y += dt * 0.25;
  controls.update();
  composer.render();
});

// UI
for (const [name, hex] of Object.entries(TRIMS)) {
  const b = document.createElement('button');
  b.style.background = '#' + hex.toString(16).padStart(6, '0');
  b.title = b.ariaLabel = name;
  b.setAttribute('aria-pressed', String(hex === trimColor));
  b.onclick = () => { trimColor = hex; for (const s of document.querySelectorAll('#trim button')) s.setAttribute('aria-pressed', String(s === b)); applyLook(); };
  document.getElementById('trim').append(b);
}
document.getElementById('mk2').onchange = applyLook;
document.getElementById('working').onchange = setWorking;
document.getElementById('grid').onchange = (e) => { grid.visible = e.target.checked; };
document.getElementById('closed').onchange = applyPose;
document.getElementById('anchors').onchange = () => current && anchorsOn(current.scene);
for (const b of document.querySelectorAll('#lods button')) b.onclick = () => show(slug, +b.dataset.lod);

fetch(BASE + 'outposts.json').then((r) => r.json()).then((m) => {
  manifest = m;
  const list = document.getElementById('list');
  for (const [k, v] of Object.entries(m)) {
    const b = document.createElement('button');
    b.dataset.slug = k;
    const [title, ...rest] = v.label.split(': ');
    b.innerHTML = `${title}<small>${rest.join(': ')}</small>`;
    b.onclick = () => { show(k, lod).then(frame); };
    list.append(b);
  }
  const first = new URLSearchParams(location.search).get('m') || Object.keys(m)[0];
  show(first, 0).then(frame);
}).catch((e) => { statusEl.textContent = 'Could not load content/outposts/outposts.json: run tools/blender/outposts/publish.py. ' + e; });
</script>
</body>
</html>
