<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulwark Tech Net</title>
<!--
  techtree3d.html — the Tech Net SANDBOX [MM-story_mvkgjacw_e]: the same view the game menu's TECH TREE screen uses
  (src/menu/technet.js) over the same data (src/data/techtree.js), with a pretend bank kept in this browser. It never
  touches the game save. Serve it (dev server or the Pages link) — ES modules don't load from file://.
-->
<style>html,body{margin:0;height:100%;background:#02050c;overflow:hidden}#net{position:fixed;inset:0}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#9fb6cc;font:600 14px system-ui;letter-spacing:.1em;text-align:center;padding:20px}</style>
</head>
<body>
<div id="net"></div><div id="err"></div>
<script type="module">
import { mountTechNet, loadTechNetDeps } from './src/menu/technet.js';
import { TECH_BY_ID, startingOwned, settleFree, techStatus, techPrice, refundBlock } from './src/data/techtree.js';

const SKEY = 'bulwark:techtree3d';
const S = { bank: 6000, owned: startingOwned(), paid: {} };
function reset() { S.bank = 6000; S.owned = startingOwned(); S.paid = {}; }
try { const j = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (j) { S.bank = j.bank; S.owned = new Set(j.owned.filter((id) => TECH_BY_ID[id])); S.paid = j.paid || {}; } } catch (e) { /* fresh */ }
const persist = () => { try { localStorage.setItem(SKEY, JSON.stringify({ bank: S.bank, owned: [...S.owned], paid: S.paid })); } catch (e) { /* private window */ } };
const ctx = () => ({ owned: S.owned, bank: S.bank, paid: S.paid });

const sandbox = {
  mode: 'sandbox',
  ctx,
  buy(id) {
    const n = TECH_BY_ID[id];
    if (techStatus(n, ctx()) !== 'ready') return false;
    const p = techPrice(n, ctx()); S.bank -= p; S.paid[id] = p; S.owned.add(id); settleFree(S.owned); persist(); return true;
  },
  refund(id) {
    const why = refundBlock(TECH_BY_ID[id], ctx()); if (why) return why;
    S.bank += S.paid[id] || 0; delete S.paid[id]; S.owned.delete(id); settleFree(S.owned); persist(); return '';
  },
  toggle(id) {   // the Map 3 milestone
    if (S.owned.has(id)) { if (TECH_BY_ID[id].kids.some((k) => S.owned.has(k))) return; S.owned.delete(id); } else S.owned.add(id);
    settleFree(S.owned); persist();
  },
  addGold(n) { S.bank += n; persist(); },
  reset() { reset(); persist(); },
};
loadTechNetDeps().then(({ THREE, addons }) => {
  const net = mountTechNet(THREE, addons, document.getElementById('net'), sandbox);
  net.start();
  window.__tt = { net, S, sandbox };
}).catch((e) => {
  const el = document.getElementById('err'); el.style.display = 'flex';
  el.textContent = 'TECH NET COULD NOT START — ' + (e && e.message ? e.message : e);
});
</script>
</body>
</html>
